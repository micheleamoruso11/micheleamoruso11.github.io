      {(owedToMe > 0 || iOwe > 0) && (
        <Section title="Spese condivise" action={<button onClick={() => goTo("accounts", "shared")} className="text-sm c-blue">Dettagli</button>}>
          <div className="panel grid grid-cols-2">
            <div className="p-4" style={{ borderRight: "1px solid var(--line)" }}>
              <div className="text-sm muted">Ti devono</div>
              <div className="num text-[20px] font-semibold mt-0.5 c-green">{fmtEUR(owedToMe)}</div>
            </div>
            <div className="p-4">
              <div className="text-sm muted">Devi</div>
              <div className={`num text-[20px] font-semibold mt-0.5 ${iOwe > 0 ? "c-red" : ""}`}>{fmtEUR(iOwe)}</div>
            </div>
          </div>
        </Section>
      )}

      <Section title="Prossimi 7 giorni" action={<button onClick={() => { setCalMonth(curKey); setSelDay(todayISO); setTab("schedule"); }} className="text-sm c-blue">Calendario</button>}>
        {next7.length ? (
          <Rows>{next7.map((s, i) => <ScheduledRow key={`${s.item.id}-${s.date}-${i}`} s={s} todayISO={todayISO} onClick={() => setRecModal({ item: recurring.find((r) => r.id === s.item.id) })} />)}</Rows>
        ) : <p className="text-sm muted">Nessun movimento in programma.</p>}
      </Section>

      <Section title="Ultimi movimenti" action={transactions.length > 0 && <button onClick={() => { setMovMonth(curKey); setTab("movements"); }} className="text-sm c-blue">Vedi tutti</button>}>
        {recentTx.length ? <Rows>{recentTx.map((t) => <TxRow key={t.id} tx={t} accounts={accounts} onClick={() => openTx(t)} />)}</Rows> : <p className="text-sm muted">Ancora nessun movimento. Usa il pulsante + per registrare la prima spesa.</p>}
      </Section>
    </div>
  );

  /* ================= Movimenti ================= */
  const q = search.trim().toLowerCase();
  const globalMode = !!q || !!tagFilter;
  const movBase = useMemo(() => (globalMode ? transactions : transactions.filter((t) => monthKeyOf(t.date) === movMonth)), [transactions, movMonth, globalMode]);
  const movFiltered = useMemo(() => movBase
    .filter((t) => typeFilter === "all" || t.type === typeFilter)
    .filter((t) => !catFilter || t.category === catFilter)
    .filter((t) => !tagFilter || (t.tags || []).some((x) => sameTag(x, tagFilter)))
    .filter((t) => {
      if (!q) return true;
      const label = t.type === "transfer" ? "giroconto" : catMeta(t.type, t.category).label.toLowerCase();
      return (t.description || "").toLowerCase().includes(q) || label.includes(q) || (t.tags || []).some((x) => x.toLowerCase().includes(q));
    })
    .sort((a, b) => b.date.localeCompare(a.date)), [movBase, typeFilter, catFilter, tagFilter, q]);
  const movGroups = useMemo(() => {
    const g = [];
    movFiltered.forEach((t) => {
      const last = g[g.length - 1];
      if (last && last.date === t.date) last.items.push(t); else g.push({ date: t.date, items: [t] });
    });
    return g;
  }, [movFiltered]);
  const movAgg = getAgg(movMonth);
  const filteredTotals = useMemo(() => movFiltered.reduce((s, t) => ({ inc: s.inc + (t.type === "income" ? t.amount : 0), exp: s.exp + (t.type === "expense" ? t.amount : 0) }), { inc: 0, exp: 0 }), [movFiltered]);

  const renderMovements = () => (
    <div>
      <h1 className="serif text-[32px] leading-tight mb-2">Movimenti</h1>
      {!globalMode && <MonthNav monthKey={movMonth} onChange={setMovMonth} max={curKey} />}
      {!globalMode && (
        <div className="panel grid grid-cols-3 mt-2">
          {[["Entrate", fmtEUR(movAgg.inc), "c-green"], ["Uscite", fmtEUR(movAgg.exp), ""], ["Saldo", fmtSigned(movAgg.inc - movAgg.exp), movAgg.inc - movAgg.exp < 0 ? "c-red" : ""]].map(([l, v, c], i) => (
            <div key={l} className="py-3 px-3" style={i ? { borderLeft: "1px solid var(--line)" } : null}>
              <div className="text-xs muted">{l}</div>
              <div className={`num text-[15px] font-semibold mt-0.5 ${c}`}>{v}</div>
            </div>
          ))}
        </div>
      )}
      <div className="relative mt-4">
        <span className="absolute muted" style={{ left: 12, top: 13 }}><Search size={18} /></span>
        <input className="inp" style={{ paddingLeft: 38 }} value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Cerca in tutti i mesi" />
      </div>
      <div className="flex gap-2 overflow-x-auto noscroll mt-3 -mx-4 px-4">
        {[["all", "Tutti"], ["expense", "Uscite"], ["income", "Entrate"], ["transfer", "Giroconti"]].map(([id, l]) => (
          <button key={id} onClick={() => { setTypeFilter(id); setCatFilter(null); }} className={`chip ${typeFilter === id ? "chip-on" : ""}`}>{l}</button>
        ))}
      </div>
      {(typeFilter === "expense" || typeFilter === "income") && (
        <div className="flex gap-2 overflow-x-auto noscroll mt-2 -mx-4 px-4">
          {(typeFilter === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map((c) => (
            <button key={c.id} onClick={() => setCatFilter(catFilter === c.id ? null : c.id)} className={`chip ${catFilter === c.id ? "chip-on" : ""}`}>{c.label}</button>
          ))}
        </div>
      )}
      {allTags.length > 0 && (
        <div className="flex gap-2 overflow-x-auto noscroll mt-2 -mx-4 px-4 items-center">
          <span className="muted shrink-0"><Tag size={15} /></span>
          {allTags.map((t) => <button key={t} onClick={() => setTagFilter(tagFilter && sameTag(tagFilter, t) ? null : t)} className={`chip ${tagFilter && sameTag(tagFilter, t) ? "chip-on" : ""}`}>#{t}</button>)}
        </div>
      )}
      {globalMode && <p className="text-xs muted mt-3 num">{movFiltered.length} risultati in tutti i mesi{filteredTotals.exp > 0 ? `, uscite ${fmtEUR(filteredTotals.exp)}` : ""}{filteredTotals.inc > 0 ? `, entrate ${fmtEUR(filteredTotals.inc)}` : ""}</p>}
      {movGroups.length ? movGroups.map((g) => {
        const net = g.items.reduce((s, t) => s + (t.type === "income" ? t.amount : t.type === "expense" ? -t.amount : 0), 0);
        return (
          <div key={g.date} className="mt-5">
            <div className="flex justify-between text-sm muted mb-1.5 px-1">
              <span>{cap(fmtDayLong(g.date))}{globalMode ? ` ${g.date.slice(0, 4)}` : ""}</span>
              <span className="num">{Math.abs(net) > 0.004 ? fmtSigned(net) : ""}</span>
            </div>
            <Rows>{g.items.map((t) => <TxRow key={t.id} tx={t} accounts={accounts} onClick={() => openTx(t)} />)}</Rows>
          </div>
        );
      }) : (
        <div className="mt-8 text-center">
          <p className="text-[15px] muted">{movBase.length ? "Nessun movimento corrisponde ai filtri." : `Nessun movimento a ${monthName(movMonth)}.`}</p>
          {!movBase.length && !globalMode && <button onClick={() => setTxModal({ tx: null, type: "expense" })} className="btn btn-ghost mt-4 mx-auto" style={{ width: "auto", display: "inline-block" }}>Registra una spesa</button>}
        </div>
      )}
    </div>
  );

  /* ================= Scadenze ================= */
  const calCells = useMemo(() => {
    const lead = (keyToDate(calMonth).getDay() + 6) % 7;
    const cells = Array(lead).fill(null);
    for (let d = 1; d <= daysInMonth(calMonth); d++) cells.push(`${calMonth}-${String(d).padStart(2, "0")}`);
    return cells;
  }, [calMonth]);
  const actualsByDay = useMemo(() => {
    const m = {};
    transactions.forEach((t) => { if (monthKeyOf(t.date) === calMonth) (m[t.date] = m[t.date] || []).push(t); });
    return m;
  }, [transactions, calMonth]);
  const calSched = useMemo(() => scheduledBetween(monthStartISO(calMonth), monthEndISO(calMonth)), [recurring, todayISO, calMonth]);
  const calSchedByDay = useMemo(() => { const m = {}; calSched.forEach((s) => { (m[s.date] = m[s.date] || []).push(s); }); return m; }, [calSched]);
  const calAgg = getAgg(calMonth);
  const schedOut = calSched.filter((s) => s.item.kind === "expense").reduce((s, x) => s + x.item.amount, 0);
  const schedIn = calSched.filter((s) => s.item.kind === "income").reduce((s, x) => s + x.item.amount, 0);
  const schedTr = calSched.filter((s) => s.item.kind === "transfer").reduce((s, x) => s + x.item.amount, 0);
  const selActs = selDay ? actualsByDay[selDay] || [] : [];
  const selSched = selDay ? calSchedByDay[selDay] || [] : [];
  const recList = recurringSorted.filter((r) => r.kind === recView);
  const recMonthly = recList.filter((r) => r.active).reduce((s, r) => s + monthlyEquivalent(r), 0);

  const renderSchedule = () => (
    <div>
      <h1 className="serif text-[32px] leading-tight mb-2">Scadenze</h1>
      <MonthNav monthKey={calMonth} onChange={(k) => { setCalMonth(k); setSelDay(k === curKey ? todayISO : null); }} />
      <div className="panel p-2.5 mt-2">
        <div className="grid grid-cols-7 text-center text-xs muted mb-1">{["L", "M", "M", "G", "V", "S", "D"].map((d, i) => <span key={i}>{d}</span>)}</div>
        <div className="grid grid-cols-7 gap-y-1">
          {calCells.map((iso, i) => {
            if (!iso) return <span key={`b${i}`} />;
            const acts = actualsByDay[iso] || [];
            const sch = calSchedByDay[iso] || [];
            const hasExp = acts.some((t) => t.type === "expense");
            const hasInc = acts.some((t) => t.type === "income");
            const hasTr = acts.some((t) => t.type === "transfer");
            const overdue = sch.some((s) => s.date < todayISO);
            const sel = iso === selDay;
            const isToday = iso === todayISO;
            return (
              <button key={iso} onClick={() => setSelDay(iso)} className="flex flex-col items-center justify-center rounded-xl" aria-label={fmtDayLong(iso)}
                style={{ height: 46, background: sel ? "var(--ink)" : "transparent", color: sel ? "var(--paper)" : iso < todayISO ? "var(--muted)" : "var(--ink)", boxShadow: isToday && !sel ? "inset 0 0 0 1.5px var(--ink)" : "none" }}>
                <span className="text-[15px] num leading-none">{Number(iso.slice(8))}</span>
                <span className="flex gap-[3px] mt-1.5" style={{ height: 6 }}>
                  {hasExp && <span style={{ width: 6, height: 6, borderRadius: 9, background: "var(--red)" }} />}
                  {hasInc && <span style={{ width: 6, height: 6, borderRadius: 9, background: "var(--green)" }} />}
                  {hasTr && <span style={{ width: 6, height: 6, borderRadius: 9, background: "var(--blue)" }} />}
                  {sch.length > 0 && <span style={{ width: 6, height: 6, borderRadius: 9, boxShadow: `inset 0 0 0 1.5px ${overdue ? "var(--red)" : "var(--ochre)"}` }} />}
                </span>
              </button>
            );
          })}
        </div>
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs muted mt-2 px-1">
        <span className="flex items-center gap-1.5"><span style={{ width: 7, height: 7, borderRadius: 9, background: "var(--red)" }} />uscita</span>
        <span className="flex items-center gap-1.5"><span style={{ width: 7, height: 7, borderRadius: 9, background: "var(--green)" }} />entrata</span>
        <span className="flex items-center gap-1.5"><span style={{ width: 7, height: 7, borderRadius: 9, background: "var(--blue)" }} />trasferimento</span>
        <span className="flex items-center gap-1.5"><span style={{ width: 7, height: 7, borderRadius: 9, boxShadow: "inset 0 0 0 1.5px var(--ochre)" }} />in programma</span>
      </div>

      <Section title={selDay && monthKeyOf(selDay) === calMonth ? cap(fmtDayLong(selDay)) : "Dettaglio del giorno"} className="mt-6">
        {!selDay || monthKeyOf(selDay) !== calMonth ? <p className="text-sm muted">Tocca un giorno del calendario.</p>
          : selSched.length || selActs.length ? (
            <Rows>
              {selSched.map((s, i) => <ScheduledRow key={`s${i}`} s={s} todayISO={todayISO} onClick={() => setRecModal({ item: recurring.find((r) => r.id === s.item.id) })} />)}
              {selActs.map((t) => <TxRow key={t.id} tx={t} accounts={accounts} onClick={() => openTx(t)} />)}
            </Rows>
          ) : <p className="text-sm muted">Nessun movimento né scadenza in questo giorno.</p>}
      </Section>

      <Section title={`Il mese di ${monthName(calMonth)}`}>
        <div className="panel grid grid-cols-2">
          <div className="p-4" style={{ borderRight: "1px solid var(--line)" }}>
            <div className="text-sm muted">Registrato</div>
            <div className="num text-[15px] mt-1">−{fmtEUR(calAgg.exp)}</div>
            <div className="num text-[15px] c-green">+{fmtEUR(calAgg.inc)}</div>
          </div>
          <div className="p-4">
            <div className="text-sm muted">Ancora in programma</div>
            <div className="num text-[15px] mt-1">−{fmtEUR(schedOut)}</div>
            <div className="num text-[15px] c-green">+{fmtEUR(schedIn)}</div>
            {schedTr > 0 && <div className="num text-[13px] c-blue">{fmtEUR(schedTr)} in trasferimenti</div>}
          </div>
        </div>
      </Section>

      <Section title="Movimenti ricorrenti">
        <div className="seg small">
          <button className={recView === "expense" ? "on" : ""} onClick={() => setRecView("expense")}>Spese fisse</button>
          <button className={recView === "income" ? "on" : ""} onClick={() => setRecView("income")}>Entrate fisse</button>
          <button className={recView === "transfer" ? "on" : ""} onClick={() => setRecView("transfer")}>Trasferimenti</button>
        </div>
        {recList.length > 0 && <p className="text-sm muted mt-3 num">{recList.filter((r) => r.active).length} attivi: {fmtEUR(recMonthly)} al mese, {fmtEUR(recMonthly * 12)} all'anno</p>}
        <div className="space-y-2.5 mt-3">
          {recList.map((r) => (
            <RecurringItem key={r.id} item={r} accounts={accounts}
              onEdit={() => setRecModal({ item: recurring.find((x) => x.id === r.id) })}
              onToggleActive={() => toggleRec(r.id, "active")}
              onToggleAuto={() => toggleRec(r.id, "auto")}
              onMarkPaid={() => markRecurringPaid(r)} />
          ))}
        </div>
        {!recList.length && <p className="text-sm muted mt-3">{recView === "expense" ? "Nessuna spesa fissa inserita." : recView === "income" ? "Nessuna entrata fissa inserita." : "Nessun trasferimento ricorrente. Usalo per i versamenti periodici verso gli investimenti."}</p>}
        <button onClick={() => setRecModal({ item: null, preset: recView === "transfer" ? newPacPreset() : { kind: recView } })} className="btn btn-ghost mt-3">
          {recView === "expense" ? "Aggiungi spesa fissa" : recView === "income" ? "Aggiungi entrata fissa" : "Aggiungi trasferimento ricorrente"}
        </button>
      </Section>
    </div>
  );

  /* ================= Analisi ================= */
  const series = useMemo(() => {
    const out = [];
    for (let i = anPeriod - 1; i >= 0; i--) {
      const k = shiftMonth(curKey, -i);
      const a = getAgg(k);
      out.push({ key: k, label: shortMonth(k), Entrate: round2(a.inc), Uscite: round2(a.exp), Saldo: round2(a.inc - a.exp) });
    }
    return out;
  }, [agg, anPeriod, curKey]);
  const completeMonths = series.filter((s) => s.key < curKey);
  const avgBase = completeMonths.length ? completeMonths : series;
  const avg = (f) => avgBase.reduce((s, x) => s + x[f], 0) / avgBase.length;
  const periodStart = monthStartISO(shiftMonth(curKey, -(anPeriod - 1)));

  const wealthSeries = useMemo(() => {
    const out = [];
    for (let i = anPeriod - 1; i >= 0; i--) {
      const k = shiftMonth(curKey, -i);
      const d = minISO(monthEndISO(k), todayISO);
      const liq = bookAt(d, liquidIds);
      const inv = round2(investAccs.reduce((s, a) => s + valueAt(a, d), 0));
      out.push({ key: k, label: shortMonth(k), Liquidità: liq, Investimenti: inv, Totale: round2(liq + inv) });
    }
    return out;
  }, [flows, accounts, anPeriod, curKey, todayISO]);

  const forecast = useMemo(() => {
    const end = addDaysISO(todayISO, forecastDays);
    const sched = scheduledBetween("1970-01-01", end);
    const from90 = addDaysISO(todayISO, -89);
    const exps = transactions.filter((t) => t.type === "expense");
    const firstDate = exps.length ? exps.reduce((m, t) => (t.date < m ? t.date : m), exps[0].date) : todayISO;
    const span = Math.max(1, Math.min(90, -daysUntil(isoToDate(firstDate), todayISO) + 1));
    const varSum = exps.filter((t) => t.category !== "abbonamenti" && !t.recurringId && !t.sharedId && t.date >= from90 && t.date <= todayISO).reduce((s, t) => s + t.amount, 0);
    const daily = exps.length ? varSum / span : 0;
    const rows = [];
    let bal = liquidity;
    let idx = 0;
    let minRow = null;
    for (let d = 0; d <= forecastDays; d++) {
      const iso = addDaysISO(todayISO, d);
      while (idx < sched.length && sched[idx].date <= iso) { bal += liqEffect(sched[idx].item); idx++; }
      const row = { iso, label: fmtDateShort(iso), scad: round2(bal), stima: round2(bal - daily * d) };
      rows.push(row);
      if (!minRow || row.stima < minRow.stima) minRow = row;
    }
    return { rows, daily, minRow, last: rows[rows.length - 1] };
  }, [transactions, recurring, todayISO, forecastDays, liquidity, accounts]);

  const anAgg = getAgg(anMonth);
  const anPrevKey = shiftMonth(anMonth, -1);
  const anPrev = getAgg(anPrevKey);
  const rate = (a) => (a.inc > 0 ? ((a.inc - a.exp) / a.inc) * 100 : null);
  const rCur = rate(anAgg), rPrev = rate(anPrev);

  const pace = useMemo(() => {
    const daily = (key) => { const a = new Array(32).fill(0); transactions.forEach((t) => { if (t.type === "expense" && monthKeyOf(t.date) === key) a[isoToDate(t.date).getDate()] += t.amount; }); return a; };
    const dim = daysInMonth(anMonth), pdim = daysInMonth(anPrevKey);
    const curLen = anMonth === curKey ? dayNum : dim;
    const a = daily(anMonth), b = daily(anPrevKey);
    const rows = [];
    let ca = 0, cb = 0;
    for (let d = 1; d <= Math.max(dim, pdim); d++) {
      if (d <= dim) ca += a[d];
      if (d <= pdim) cb += b[d];
      rows.push({ day: d, cur: d <= curLen ? round2(ca) : null, prev: d <= pdim ? round2(cb) : null });
    }
    return { rows, curLen, atDayCur: rows[curLen - 1]?.cur ?? 0, atDayPrev: rows[Math.min(curLen, pdim) - 1]?.prev ?? 0 };
  }, [transactions, anMonth, curKey, dayNum]);

  const heat = useMemo(() => {
    const days = {};
    transactions.forEach((t) => { if (t.type === "expense" && monthKeyOf(t.date) === anMonth) { days[t.date] = days[t.date] || { tot: 0, n: 0 }; days[t.date].tot += t.amount; days[t.date].n++; } });
    const max = Object.values(days).reduce((m, x) => Math.max(m, x.tot), 0);
    const lead = (keyToDate(anMonth).getDay() + 6) % 7;
    const cells = Array(lead).fill(null);
    for (let d = 1; d <= daysInMonth(anMonth); d++) cells.push(`${anMonth}-${String(d).padStart(2, "0")}`);
    return { days, max, cells };
  }, [transactions, anMonth]);

  const weekdayAvg = useMemo(() => {
    const sums = Array(7).fill(0), counts = Array(7).fill(0);
    let iso = periodStart, guard = 0;
    while (iso <= todayISO && guard < 400) { counts[(isoToDate(iso).getDay() + 6) % 7]++; iso = addDaysISO(iso, 1); guard++; }
    transactions.forEach((t) => { if (t.type === "expense" && t.date >= periodStart && t.date <= todayISO) sums[(isoToDate(t.date).getDay() + 6) % 7] += t.amount; });
    const avgs = sums.map((s, i) => (counts[i] ? s / counts[i] : 0));
    const max = Math.max(...avgs);
    return { avgs, max, top: avgs.indexOf(max) };
  }, [transactions, periodStart, todayISO]);

  const catRows = useMemo(() => {
    const ids = new Set([...Object.keys(anAgg.cat), ...Object.keys(anPrev.cat)]);
    return [...ids].map((id) => { const m = catMeta("expense", id); return { id, label: m.label, color: m.color, cur: anAgg.cat[id] || 0, prev: anPrev.cat[id] || 0 }; }).sort((a, b) => b.cur - a.cur || b.prev - a.prev);
  }, [anAgg, anPrev]);
  const donut = catRows.filter((r) => r.cur > 0);
  const selRow = catRows.find((r) => r.id === selCat);
  const catSeries = useMemo(() => (selCat ? series.map((s) => ({ label: s.label, key: s.key, value: round2(getAgg(s.key).cat[selCat] || 0) })) : []), [selCat, series]);
  const catAvg = catSeries.length ? catSeries.reduce((s, x) => s + x.value, 0) / catSeries.length : 0;

  const merchants = useMemo(() => {
    const m = {};
    transactions.forEach((t) => {
      if (t.type !== "expense" || !t.description || t.date < periodStart) return;
      const k = t.description.trim().toLowerCase();
      m[k] = m[k] || { name: t.description.trim(), n: 0, tot: 0, cat: t.category };
      m[k].n++; m[k].tot += t.amount;
    });
    const list = Object.values(m).sort((a, b) => (merchSort === "total" ? b.tot - a.tot : b.n - a.n || b.tot - a.tot)).slice(0, 10);
    const maxV = list.reduce((mx, x) => Math.max(mx, merchSort === "total" ? x.tot : x.n), 0);
    return { list, maxV };
  }, [transactions, periodStart, merchSort]);

  const tagStats = useMemo(() => {
    const m = {};
    transactions.forEach((t) => (t.tags || []).forEach((tag) => {
      const k = tag.toLowerCase();
      m[k] = m[k] || { name: tag, exp: 0, inc: 0, n: 0, first: t.date, last: t.date };
      if (t.type === "expense") m[k].exp += t.amount;
      if (t.type === "income") m[k].inc += t.amount;
      m[k].n++;
      if (t.date < m[k].first) m[k].first = t.date;
      if (t.date > m[k].last) m[k].last = t.date;
    }));
    return Object.values(m).sort((a, b) => b.exp - a.exp);
  }, [transactions]);

  const tickStyle = { fill: theme.muted, fontSize: 11 };
  const noCharts = <p className="text-sm muted p-4">Grafici non disponibili: la libreria non si è caricata. Ricarica l'app con la connessione attiva.</p>;
  const heatColor = (v) => (v > 0 && heat.max > 0 ? `color-mix(in srgb, var(--red) ${Math.round(18 + 70 * Math.sqrt(v / heat.max))}%, var(--surface2))` : "var(--surface2)");
  const PeriodChips = () => (
    <div className="flex gap-2">
      {[3, 6, 12].map((n) => <button key={n} onClick={() => setAnPeriod(n)} className={`chip ${anPeriod === n ? "chip-on" : ""}`}>{n} mesi</button>)}
    </div>
  );

  const renderAnalysisTrend = () => (

              return (
                <button key={a.id} onClick={() => setAccModal({ acc: a })} className="w-full flex items-center gap-3 py-3.5 text-left">
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: ACCOUNT_COLORS[i % ACCOUNT_COLORS.length] }} />
                  <span className="flex-1 min-w-0">
                    <span className="block text-[15px] truncate">{a.name}</span>
                    {positiveCash > 0 && a.balance > 0 && <span className="block text-xs muted num">{((a.balance / positiveCash) * 100).toFixed(0)}% della liquidità</span>}
                  </span>
                  <span className={`num text-[15px] font-semibold ${a.balance < 0 ? "c-red" : ""}`}>{fmtEUR(a.balance)}</span>
                </button>
              );
            })}
          </Rows>
        ) : <p className="text-[15px] muted">Nessun conto. Aggiungine uno con il saldo di oggi per far partire i calcoli.</p>}
      </Section>
      {investAccs.length > 0 && (
        <Section title="Investimenti" action={<button onClick={() => setAccTab("invest")} className="text-sm c-blue">Dettagli</button>}>
          <Rows>
            {investAccs.map((a) => {
              const val = accountValue(a), g = val - a.balance;
              return (
                <button key={a.id} onClick={() => setAccModal({ acc: a })} className="w-full flex items-center gap-3 py-3.5 text-left">
                  <span className="c-blue"><InvestIcon size={16} /></span>
                  <span className="flex-1 min-w-0"><span className="block text-[15px] truncate">{a.name}</span><span className="block text-xs muted num">versati {fmtEUR(a.balance)}</span></span>
                  <span className="text-right"><span className="block num text-[15px] font-semibold">{fmtEUR(val)}</span>{Math.abs(g) > 0.004 && <span className={`block num text-xs ${g >= 0 ? "c-green" : "c-red"}`}>{fmtSigned(g)}</span>}</span>
                </button>
              );
            })}
          </Rows>
        </Section>
      )}
      <div className="grid grid-cols-2 gap-2 mt-3">
        <button onClick={() => setAccModal({ acc: null })} className="btn btn-ghost">Nuovo conto</button>
        <button onClick={() => setTrModal({ tx: null })} className="btn btn-ghost">Giroconto</button>
      </div>

      <Section title="Importazione da Wallet e Siri">
        <div className="panel p-4">
          <p className="text-sm muted">
            {data.walletLastImport ? `Ultima importazione ${relativeDay(data.walletLastImport, todayISO)}. ` : "Nessuna importazione finora. "}
            {Object.keys(data.cardMap).length > 0 && `Carte abbinate a un conto: ${Object.keys(data.cardMap).length}. `}
            {Object.keys(data.merchantMap).length > 0 && `Esercenti riconosciuti: ${Object.keys(data.merchantMap).length}.`}
          </p>
          <button onClick={() => setGuide(true)} className="btn btn-ghost mt-3">Guida alla configurazione</button>
        </div>
      </Section>
      <Section title="Backup"><BackupSection data={data} onImport={(d) => { setData(d); setNote("Backup ripristinato"); }} /></Section>
      <Section title="Dati">
        <div className="panel p-4">
          <p className="text-sm muted">Cancella conti, movimenti, scadenze, obiettivi, investimenti e spese condivise da questo telefono. L'operazione non si può annullare.</p>
          <DeleteButton label="Cancella tutti i dati" onConfirm={() => { setData({ ...EMPTY_DATA }); setNote("Dati cancellati"); }} />
        </div>
      </Section>
    </>
  );

  const renderInvest = () => {
    if (!investAccs.length) {
      return (
        <div className="mt-6">
          <div className="relative overflow-hidden p-5" style={{ background: "var(--inv)", color: "var(--note-ink)", borderRadius: 22 }}>
            <Guilloche color="var(--inv-line)" />
            <div className="relative">
              <div className="serif text-[24px] leading-tight">Segui i tuoi investimenti</div>
              <p className="text-sm mt-2" style={{ color: "var(--inv-soft)" }}>Crea un conto di tipo Investimenti, per esempio la carta da cui investi. I versamenti verso quel conto non contano come spese e l'app calcola quanto rendono.</p>
              <button onClick={() => setAccModal({ acc: null, presetType: "invest" })} className="mt-4 px-4 py-2.5 rounded-xl font-semibold text-sm" style={{ background: "var(--note-ink)", color: "var(--inv)" }}>Aggiungi conto investimenti</button>
            </div>
          </div>
          <p className="text-sm muted mt-4">Se il conto che usi per investire è già nell'elenco, aprilo da Conti e cambia il tipo in Investimenti.</p>
        </div>
      );
    }
    const pct = investBook > 0 ? (investGain / investBook) * 100 : 0;
    const lastVals = investAccs.map(lastValuation).filter(Boolean);
    const lastValDate = lastVals.length ? lastVals.map((v) => v.date).sort().pop() : null;
    return (
      <>
        <div className="relative overflow-hidden mt-5" style={{ background: "var(--inv)", color: "var(--note-ink)", borderRadius: 22 }}>
          <Guilloche color="var(--inv-line)" />
          <div className="relative p-5">
            <div className="text-sm" style={{ color: "var(--inv-soft)" }}>Valore attuale</div>
            <div className="serif num mt-1" style={{ fontSize: 40, lineHeight: 1.05 }}>{fmtEUR(investValue)}</div>
            <div className="flex items-center gap-2 mt-2">
              <span className="num text-sm font-semibold px-2 py-0.5 rounded-full" style={{ background: investGain >= 0 ? "rgba(109,190,145,.25)" : "rgba(236,128,150,.25)" }}>{fmtSigned(investGain)} ({fmtPct(pct)})</span>
            </div>
            <div className="grid grid-cols-2 gap-4 mt-5">
              <div><div className="text-xs" style={{ color: "var(--inv-soft)" }}>Versato in totale</div><div className="num text-lg font-semibold mt-0.5">{fmtEUR(investBook)}</div></div>
              <div><div className="text-xs" style={{ color: "var(--inv-soft)" }}>Versamento automatico</div><div className="num text-lg font-semibold mt-0.5">{pacMonthly > 0 ? `${fmtEUR(pacMonthly)}/mese` : "nessuno"}</div></div>
            </div>
            <div className="text-xs mt-4" style={{ color: "var(--inv-soft)" }}>{lastValDate ? `Valore aggiornato il ${fmtDateShort(lastValDate)}` : "Valore non ancora aggiornato: per ora coincide con il versato"}</div>
          </div>
        </div>
        <button onClick={() => setValModal({ id: investAccs[0].id })} className="btn btn-ink mt-3">Aggiorna il valore</button>

        <Section title="Versato e valore nel tempo">
          <div className="panel pt-4 pr-2 pb-1">
            {!RC ? noCharts : (
              <RC.ResponsiveContainer width="100%" height={210}>
                <RC.AreaChart data={investSeries} margin={{ top: 4, right: 6, left: 0, bottom: 0 }}>
                  <defs>
                    <linearGradient id="gVal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={theme.blue} stopOpacity={0.5} /><stop offset="100%" stopColor={theme.blue} stopOpacity={0.05} /></linearGradient>
                  </defs>
                  <RC.CartesianGrid stroke={theme.line} vertical={false} />
                  <RC.XAxis dataKey="label" tick={tickStyle} axisLine={false} tickLine={false} minTickGap={20} />
                  <RC.YAxis tick={tickStyle} axisLine={false} tickLine={false} width={44} tickFormatter={compactEUR} />
                  <RC.Tooltip content={<ChartTip />} />
                  <RC.Area type="monotone" dataKey="Valore" stroke={theme.blue} strokeWidth={2.2} fill="url(#gVal)" />
                  <RC.Area type="stepAfter" dataKey="Versato" stroke={theme.muted} strokeDasharray="4 4" strokeWidth={1.6} fill="none" />
                </RC.AreaChart>
              </RC.ResponsiveContainer>
            )}
          </div>
          <p className="text-xs muted mt-2">La linea tratteggiata è quanto hai versato; l'area è quanto vale. Più aggiorni il valore, più il grafico è preciso.</p>
        </Section>

        <Section title="Versamenti automatici">
          {pacItems.length ? (
            <Rows>
              {pacItems.map((r) => {
                const rs = recurringSorted.find((x) => x.id === r.id);
                return (
                  <button key={r.id} onClick={() => setRecModal({ item: r })} className="w-full flex items-center gap-3 py-3 text-left">
                    <span className="c-blue"><RefreshCw size={16} /></span>
                    <span className="flex-1 min-w-0">
                      <span className="block text-[15px] truncate">{r.name}</span>
                      <span className="block text-xs muted">{FREQ_LABEL[r.frequency]}, da {accById[r.accountId]?.name || "?"}{rs?.nextISO ? `, prossimo ${fmtDateShort(rs.nextISO)}` : ""}</span>
                    </span>
                    <span className="num text-[15px] font-semibold c-blue">{fmtEUR(r.amount)}</span>
                  </button>
                );
              })}
            </Rows>
          ) : (
            <div className="panel p-4">
              <p className="text-sm muted">Imposta il trasferimento mensile dalla carta principale a quella degli investimenti: l'app lo registrerà da sola, senza contarlo come spesa.</p>
            </div>
          )}
          <button onClick={() => setRecModal({ item: null, preset: newPacPreset() })} className="btn btn-ghost mt-3">{pacItems.length ? "Aggiungi un altro versamento" : "Imposta versamento automatico"}</button>
        </Section>

        <Section title="Simulatore">
          <div className="panel p-4">
            <Slider label="Versamento mensile" value={simMonthlyVal} min={0} max={500} step={5} onChange={setSimMonthly} display={(v) => fmtEUR0(v)} />
            <Slider label="Rendimento annuo ipotizzato" value={simRate} min={0} max={10} step={0.5} onChange={(v) => setInvestSetting("rate", v)} display={(v) => `${String(v).replace(".", ",")}%`} />
            <Slider label="Durata" value={simYears} min={1} max={40} step={1} onChange={(v) => setInvestSetting("years", v)} display={(v) => `${v} ${v === 1 ? "anno" : "anni"}`} />
            {RC && (
              <RC.ResponsiveContainer width="100%" height={190}>
                <RC.AreaChart data={simSeries} margin={{ top: 4, right: 4, left: 0, bottom: 0 }}>
                  <defs>
                    <linearGradient id="gSimV" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={theme.muted} stopOpacity={0.35} /><stop offset="100%" stopColor={theme.muted} stopOpacity={0.1} /></linearGradient>
                    <linearGradient id="gSimR" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={theme.green} stopOpacity={0.6} /><stop offset="100%" stopColor={theme.green} stopOpacity={0.15} /></linearGradient>
                  </defs>
                  <RC.CartesianGrid stroke={theme.line} vertical={false} />
                  <RC.XAxis dataKey="label" tick={tickStyle} axisLine={false} tickLine={false} minTickGap={16} />
                  <RC.YAxis tick={tickStyle} axisLine={false} tickLine={false} width={44} tickFormatter={compactEUR} />
                  <RC.Tooltip content={<ChartTip />} />
                  <RC.Area type="monotone" dataKey="Versato" stackId="s" stroke={theme.muted} fill="url(#gSimV)" strokeWidth={1.5} />
                  <RC.Area type="monotone" dataKey="Rendimento" stackId="s" stroke={theme.green} fill="url(#gSimR)" strokeWidth={2} />
                </RC.AreaChart>
              </RC.ResponsiveContainer>
            )}
            <div className="grid grid-cols-3 gap-2 mt-3 text-center">
              <div><div className="text-xs muted">Valore finale</div><div className="num text-[15px] font-semibold">{fmtEUR0(simEnd.valore)}</div></div>
              <div><div className="text-xs muted">Versato</div><div className="num text-[15px] font-semibold">{fmtEUR0(simEnd.Versato)}</div></div>
              <div><div className="text-xs muted">Interessi composti</div><div className="num text-[15px] font-semibold c-green">{fmtEUR0(simEnd.Rendimento)}</div></div>
            </div>
          </div>
          <p className="text-xs muted mt-2">Stima con rendimento costante, partendo dal valore di oggi. I mercati oscillano e i rendimenti passati non garantiscono quelli futuri; tasse e commissioni non sono incluse.</p>
        </Section>
      </>
    );
  };

  const renderGoals = () => (
    <>
      <div className="mt-5 panel p-4 flex items-center gap-4">
        <Ring value={goals.length ? goals.reduce((s, g) => s + Math.min(g.saved, g.target), 0) / Math.max(1, goals.reduce((s, g) => s + g.target, 0)) : 0} size={84} stroke={9} color="var(--green)">
          <Target size={22} className="c-green" />
        </Ring>
        <div className="min-w-0">
          <div className="text-sm muted">Accantonato in tutto</div>
          <div className="serif num text-[28px] leading-tight">{fmtEUR(goalsSaved)}</div>
          <div className="text-sm muted num">su {fmtEUR(goals.reduce((s, g) => s + g.target, 0))} di obiettivi</div>
          <div className="text-xs muted num mt-1">Liquidità libera: {fmtEUR(liquidity - goalsSaved)}</div>
        </div>
      </div>
      {liquidity - goalsSaved < 0 && <p className="text-sm c-red mt-2">Hai accantonato più della liquidità disponibile: rivedi le cifre degli obiettivi.</p>}
      {goals.length ? (
        <div className="grid grid-cols-2 gap-3 mt-4">
          {goals.map((g) => <GoalCard key={g.id} g={g} todayISO={todayISO} onOpen={() => setGoalOpen(g.id)} />)}
        </div>
      ) : <p className="text-[15px] muted mt-4">Nessun obiettivo. Crea il primo: una vacanza, il viaggio di Natale, un fondo per gli imprevisti.</p>}
      <button onClick={() => setGoalModal({ goal: null })} className="btn btn-ink mt-4">Nuovo obiettivo</button>
      <p className="text-xs muted mt-3">Gli obiettivi non spostano denaro: segnano quanta parte della liquidità è già destinata.</p>
    </>
  );

  const maxAbsBal = Math.max(0, ...people.map((p) => Math.abs(peopleBal[p.id] || 0)));
  const renderShared = () => (
    <>
      <div className="panel grid grid-cols-2 mt-5">
        <div className="p-4" style={{ borderRight: "1px solid var(--line)" }}><div className="text-sm muted">Ti devono</div><div className="num text-[22px] font-semibold mt-0.5 c-green">{fmtEUR(owedToMe)}</div></div>
        <div className="p-4"><div className="text-sm muted">Devi</div><div className={`num text-[22px] font-semibold mt-0.5 ${iOwe > 0 ? "c-red" : ""}`}>{fmtEUR(iOwe)}</div></div>
      </div>
      <Section title="Persone">
        {people.length ? (
          <Rows>
            {people.map((p) => {
              const b = peopleBal[p.id] || 0;
              const w = maxAbsBal > 0 ? (Math.abs(b) / maxAbsBal) * 50 : 0;
              return (
                <button key={p.id} onClick={() => setPersonOpen(p.id)} className="w-full text-left py-3.5">
                  <div className="flex items-center gap-3">
                    <span className="w-9 h-9 rounded-full flex items-center justify-center shrink-0 font-semibold" style={{ background: "var(--surface2)" }}>{p.name.charAt(0).toUpperCase()}</span>
                    <span className="flex-1 min-w-0"><span className="block text-[15px] truncate">{p.name}</span><span className="block text-xs muted">{b > 0.004 ? "ti deve" : b < -0.004 ? "gli devi" : "siete pari"}</span></span>
                    <span className={`num text-[15px] font-semibold ${b > 0.004 ? "c-green" : b < -0.004 ? "c-red" : "muted"}`}>{Math.abs(b) > 0.004 ? fmtEUR(Math.abs(b)) : ""}</span>
                  </div>
                  <div className="relative mt-2.5" style={{ height: 8, background: "var(--surface2)", borderRadius: 999 }}>
                    <div style={{ position: "absolute", left: "50%", top: -3, bottom: -3, width: 1.5, background: "var(--muted)", opacity: 0.4 }} />
                    {w > 0 && <div style={{ position: "absolute", top: 0, bottom: 0, borderRadius: 999, background: b > 0 ? "var(--green)" : "var(--red)", left: b > 0 ? "50%" : `${50 - w}%`, width: `${w}%` }} />}
                  </div>
                </button>
              );
            })}
          </Rows>
        ) : <p className="text-[15px] muted">Nessuna persona. Si aggiungono direttamente quando registri la prima spesa condivisa.</p>}
        {people.length > 0 && <p className="text-xs muted mt-2">A destra del centro chi ti deve soldi, a sinistra chi devi rimborsare.</p>}
        <button onClick={() => setSharedModal(true)} className="btn btn-ink mt-3">Nuova spesa condivisa</button>
      </Section>
      {sharedSorted.length > 0 && (
        <Section title="Ultime voci">
          <Rows>
            {sharedSorted.slice(0, 15).map((e) => (
              <div key={e.id} className="py-3">
                <div className="flex items-baseline justify-between gap-3">
                  <span className="text-[15px] truncate">{e.kind === "settle" ? (e.direction === "in" ? `${personName(e.personId)} ti ha restituito` : `Hai restituito a ${personName(e.personId)}`) : e.description}</span>
                  <span className="num text-[15px] shrink-0">{fmtEUR(e.kind === "settle" ? e.amount : e.total)}</span>
                </div>
                <div className="text-xs muted mt-0.5">{fmtDateShort(e.date)}{e.kind === "expense" ? `, pagato da ${e.payer === "me" ? "te" : personName(e.payer)}, con ${e.participants.map(personName).join(", ")}${e.includeMe ? " e te" : ""}` : ""}</div>
              </div>
            ))}
          </Rows>
          <p className="text-xs muted mt-2">Per eliminare una voce apri la persona coinvolta e usa lo storico.</p>
        </Section>
      )}
    </>
  );

  const renderAccounts = () => (
    <div>
      <h1 className="serif text-[32px] leading-tight mb-3">Conti</h1>
      <div className="seg small">
        <button className={accTab === "accounts" ? "on" : ""} onClick={() => setAccTab("accounts")}>Conti</button>
        <button className={accTab === "invest" ? "on" : ""} onClick={() => setAccTab("invest")}>Investimenti</button>
        <button className={accTab === "goals" ? "on" : ""} onClick={() => setAccTab("goals")}>Obiettivi</button>
        <button className={accTab === "shared" ? "on" : ""} onClick={() => setAccTab("shared")}>Condivise</button>
      </div>
      {accTab === "accounts" && renderAccountsMain()}
      {accTab === "invest" && renderInvest()}
      {accTab === "goals" && renderGoals()}
      {accTab === "shared" && renderShared()}
    </div>
  );

  const views = { overview: renderOverview, movements: renderMovements, schedule: renderSchedule, analysis: renderAnalysis, accounts: renderAccounts };
  const openPerson = people.find((p) => p.id === personOpen);
  const settlePerson = people.find((p) => p.id === settleFor);
  const openGoal = goals.find((g) => g.id === goalOpen);

  return (
    <div style={{ minHeight: "100vh" }}>
      <main className="max-w-xl mx-auto px-4" style={{ paddingTop: "calc(env(safe-area-inset-top) + 18px)", paddingBottom: "calc(env(safe-area-inset-bottom) + 150px)" }}>
        {views[tab]()}
      </main>

      <input ref={walletRef} type="file" accept=".txt,text/plain" style={{ display: "none" }} onChange={onWalletFile} />

      {note && (
        <div className="fixed left-4 right-4 z-50 flex justify-center fade" style={{ top: "calc(env(safe-area-inset-top) + 10px)" }}>
          <div className="flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium" style={{ background: "var(--ink)", color: "var(--paper)", boxShadow: "0 6px 20px rgba(0,0,0,.18)" }}><Check size={16} /> {note}</div>
        </div>
      )}

      <button onClick={() => setAddSheet(true)} aria-label="Aggiungi" className="fixed z-30 flex items-center justify-center active:scale-95"
        style={{ right: 18, bottom: "calc(env(safe-area-inset-bottom) + 76px)", width: 56, height: 56, borderRadius: 999, background: "var(--ink)", color: "var(--paper)", boxShadow: "0 8px 22px rgba(0,0,0,.22)" }}>
        <Plus size={26} />
      </button>

      <nav className="fixed bottom-0 left-0 right-0 z-30" style={{ background: "var(--surface)", borderTop: "1px solid var(--line)", paddingBottom: "env(safe-area-inset-bottom)" }}>
        <div className="max-w-xl mx-auto flex">
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex-1 flex flex-col items-center gap-1 pt-2 pb-1.5" style={{ color: tab === t.id ? "var(--ink)" : "var(--muted)" }} aria-current={tab === t.id ? "page" : undefined}>
              <t.Icon size={21} />
              <span className="text-[11px]" style={{ fontWeight: tab === t.id ? 700 : 500 }}>{t.label}</span>
            </button>
          ))}
        </div>
      </nav>

      {addSheet && <AddSheet onClose={() => setAddSheet(false)} onPick={pickAdd} />}
      {walletReview && <WalletReviewSheet items={walletReview} accounts={accounts} onClose={() => setWalletReview(null)} onConfirm={confirmWallet} onIgnore={ignoreWallet} />}
      {guide && <GuideSheet onClose={() => setGuide(false)} />}
      {txModal && <TxFormModal tx={txModal.tx} initialType={txModal.type} accounts={accounts} allTags={allTags} todayISO={todayISO} onClose={() => setTxModal(null)} onSave={saveTx} onDelete={deleteTx} />}
      {trModal && <TransferModal tx={trModal.tx} accounts={accounts} todayISO={todayISO} onClose={() => setTrModal(null)} onSave={saveTx} onDelete={deleteTx} onAddAccount={() => { setTrModal(null); setAccModal({ acc: null }); }} />}
      {recModal && <RecurringFormModal item={recModal.item} preset={recModal.preset} accounts={accounts} todayISO={todayISO} onClose={() => setRecModal(null)} onSave={saveRecurring} onDelete={deleteRecurring} />}
      {accModal && <AccountFormModal account={accModal.acc} presetType={accModal.presetType} onClose={() => setAccModal(null)} onSave={saveAccount} onDelete={deleteAccount} />}
      {valModal && <ValuationModal accounts={investAccs} initialId={valModal.id} todayISO={todayISO} onClose={() => setValModal(null)} onSave={saveValuation} />}
      {budgetModal && <BudgetModal cat={budgetModal.cat} limit={budgets[budgetModal.cat.id] || 0} spent={curAgg.cat[budgetModal.cat.id] || 0} onClose={() => setBudgetModal(null)} onSave={(v) => setBudget(budgetModal.cat.id, v)} onRemove={() => setBudget(budgetModal.cat.id, 0)} />}
      {openGoal && !goalModal && <GoalDetailSheet goal={openGoal} todayISO={todayISO} theme={theme} onClose={() => setGoalOpen(null)} onMove={(delta) => moveGoal(openGoal.id, delta)} onEdit={() => setGoalModal({ goal: openGoal })} />}
      {goalModal && <GoalModal goal={goalModal.goal} colorIndex={goals.length} onClose={() => setGoalModal(null)} onSave={saveGoal} onDelete={deleteGoal} />}
      {sharedModal && <SharedExpenseModal people={people} accounts={accounts} todayISO={todayISO} onClose={() => setSharedModal(false)} onSave={saveShared} onAddPerson={addPerson} />}
      {openPerson && !settlePerson && (
        <PersonSheet person={openPerson} balance={peopleBal[openPerson.id] || 0}
          entries={sharedSorted.map((e) => ({ e, eff: round2(entryEffectFor(e, openPerson.id)) })).filter(({ e, eff }) => Math.abs(eff) > 0.004 || (e.kind === "expense" && (e.participants.includes(openPerson.id) || e.payer === openPerson.id)))}
          onClose={() => setPersonOpen(null)} onSettle={() => setSettleFor(openPerson.id)} onRename={(n) => renamePerson(openPerson.id, n)} onDelete={() => deletePerson(openPerson.id)} onDeleteEntry={deleteShared} />
      )}
      {settlePerson && <SettleModal person={settlePerson} balance={peopleBal[settlePerson.id] || 0} accounts={accounts} todayISO={todayISO} onClose={() => setSettleFor(null)} onSave={saveShared} />}
    </div>
  );
}

window.__appStarted = true;
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
