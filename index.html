<style>
  :root {
    --paper: #ECF0EA; --surface: #F7F9F5; --surface2: #E2E8DF; --ink: #16232B; --muted: #5A686A; --line: #D2DACF;
    --green: #2E6A4E; --red: #A63249; --ochre: #9E680C; --blue: #2C5C8A;
    --note: #1E4637; --note-ink: #EEF4EC; --note-soft: #A9CBB8; --note-line: #4F8A6E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #111B1B; --surface: #192626; --surface2: #213030; --ink: #E3EAE4; --muted: #8FA09B; --line: #2A3A39;
      --green: #6DBE91; --red: #EC8096; --ochre: #E3AA4A; --blue: #8AB6E0;
      --note: #1D4434; --note-ink: #EEF4EC; --note-soft: #9DC4AE; --note-line: #4C8A6B;
    }
  }
  html, body { background: var(--paper); color: var(--ink); margin: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .serif { font-family: "Young Serif", Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .c-green { color: var(--green); } .c-red { color: var(--red); } .c-ochre { color: var(--ochre); } .c-blue { color: var(--blue); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .inp { width: 100%; box-sizing: border-box; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: var(--ink); font: inherit; font-size: 16px; min-height: 46px; -webkit-appearance: none; appearance: none; }
  .inp:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .inp.bad { border-color: var(--red); }
  .lbl { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .chip { border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 7px 13px; font-size: 13px; white-space: nowrap; }
  .chip-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn { display: block; width: 100%; border-radius: 12px; padding: 13px 16px; font-weight: 600; font-size: 15px; text-align: center; }
  .btn-ink { background: var(--ink); color: var(--paper); }
  .btn-ink:disabled { opacity: .3; }
  .btn-ghost { border: 1px solid var(--line); }
  .btn-danger { color: var(--red); }
  .btn-danger-on { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
  .seg { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; padding: 9px 6px; border-radius: 9px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; }

  .wallet-btn { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 16px 16px 12px; border-radius: 20px; background: var(--ink); color: var(--paper); overflow: hidden; text-align: left; transition: transform .12s ease; }
  .wallet-btn:active { transform: scale(.98); }
  .wallet-sub { color: color-mix(in srgb, var(--paper) 62%, transparent); }
  .wallet-stack { position: relative; width: 58px; height: 46px; flex-shrink: 0; }
  .wallet-card { position: absolute; left: 9px; top: 10px; width: 42px; height: 27px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.28); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .wallet-card.c1 { background: #C2862B; transform: translate(-5px, 5px) rotate(-11deg); }
  .wallet-card.c2 { background: #A63249; transform: translate(-1px, 2px) rotate(-4deg); }
  .wallet-card.c3 { background: #2E6A4E; transform: translate(4px, -3px) rotate(5deg); }

  .wallet-go { width: 36px; height: 36px; border-radius: 999px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid color-mix(in srgb, var(--paper) 28%, transparent); }

  @media (prefers-reduced-motion: no-preference) {

    .fade { animation: fadeIn .18s ease-out; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #boot button { margin-top: 16px; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 20px; font-size: 15px; }
  #boot .err { color: var(--red); font-size: 12px; margin-top: 10px; word-break: break-word; }

<script>
  window.__appStarted = false;
  window.__bootFail = function (msg) {
    if (window.__appStarted) return;
    var b = document.getElementById("boot");
    if (!b) return;
    b.innerHTML =
      "Impossibile avviare l'app.<br>Controlla la connessione e riprova." +
      '<div class="err">' + String(msg || "").replace(/</g, "&lt;") + "</div>" +
      '<button onclick="location.reload()">Riprova</button>';
  };
  window.addEventListener("error", function (e) {
    var t = e && e.target;
    if (t && t.tagName === "SCRIPT" && t.src) {
      if (t.getAttribute("data-optional") !== "1") window.__bootFail("Libreria non caricata: " + t.src);
      return;
    }
    if (e && e.message) window.__bootFail(e.message);
  }, true);
  setTimeout(function () { if (!window.__appStarted) window.__bootFail("Tempo di caricamento scaduto"); }, 25000);

  (function () {
    try {
      var c = document.createElement("canvas");
      c.width = 180; c.height = 180;
      var x = c.getContext("2d");
      x.fillStyle = "#1E4637";
      x.fillRect(0, 0, 180, 180);
      x.strokeStyle = "#3F7A5E";
      x.lineWidth = 1.2;
      for (var i = 0; i < 12; i++) {
        x.beginPath();
        for (var px = 0; px <= 180; px += 3) {
          var py = 12 + i * 15 + 5 * Math.sin(px / 14 + i * 0.6);
          if (px === 0) x.moveTo(px, py); else x.lineTo(px, py);
        }
        x.stroke();
      }
      x.fillStyle = "#EEF4EC";
      x.font = "bold 100px Georgia, serif";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillText("€", 90, 96);
      var url = c.toDataURL("image/png");
      ["apple-touch-icon", "icon"].forEach(function (rel) {
        var l = document.createElement("link");
        l.rel = rel; l.href = url;
        document.head.appendChild(l);
      });
    } catch (e) {}
  })();
</script>

const Shirt = mkIcon(<path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z" />);

/* ---------- Costanti ---------- */
const STORAGE_KEY = "flussi-economici-v1";
const BACKUP_KEY = "flussi-economici-last-backup";

  { id: "streaming", label: "Streaming" },

const ACCOUNT_COLORS = ["var(--green)", "var(--blue)", "var(--ochre)", "#8E4A84", "#3E8A99", "#B4495B"];

/* ---------- Utilità ---------- */
const fmtEUR = (n) => new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" }).format(n || 0);
const fmtSigned = (n) => (n > 0.004 ? "+" : n < -0.004 ? "−" : "") + fmtEUR(Math.abs(n));
const round2 = (n) => Math.round(n * 100) / 100;
const compactEUR = (v) => (Math.abs(v) >= 1000 ? `${(v / 1000).toFixed(1).replace(".", ",")}k` : `${Math.round(v)}`);
const localISODate = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const isoToDate = (iso) => new Date(iso + "T00:00:00");
const addDaysISO = (iso, n) => { const d = isoToDate(iso); d.setDate(d.getDate() + n); return localISODate(d); };
const maxISO = (a, b) => (a > b ? a : b);
const monthKeyOf = (s) => s.slice(0, 7);
const keyToDate = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, 1); };
const shiftMonth = (key, delta) => { const d = keyToDate(key); d.setMonth(d.getMonth() + delta); return localISODate(d).slice(0, 7); };
const daysInMonth = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const monthStartISO = (key) => `${key}-01`;
const monthEndISO = (key) => `${key}-${String(daysInMonth(key)).padStart(2, "0")}`;
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const intl = (opts) => new Intl.DateTimeFormat("it-IT", opts);
const monthLabel = (key) => intl({ month: "long", year: "numeric" }).format(keyToDate(key));
const monthName = (key) => intl({ month: "long" }).format(keyToDate(key));
const shortMonth = (key) => intl({ month: "short" }).format(keyToDate(key)).replace(".", "");
const fmtDateShort = (iso) => intl({ day: "numeric", month: "short" }).format(isoToDate(iso));
const fmtDayLong = (iso) => intl({ weekday: "long", day: "numeric", month: "long" }).format(isoToDate(iso));
const fmtDayShortW = (iso) => intl({ weekday: "short", day: "numeric", month: "short" }).format(isoToDate(iso));
const weekdayShort = (iso) => intl({ weekday: "short" }).format(isoToDate(iso)).replace(".", "");
const parseAmount = (s) => parseFloat(String(s).replace(/\s/g, "").replace(",", "."));
const uid = (p) => `${p}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
const daysUntil = (date, todayISO) => Math.round((date - isoToDate(todayISO)) / 86400000);
const catMeta = (type, id) => {
  const list = type === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  return list.find((c) => c.id === id) || list[list.length - 1];
};
const dueText = (days) =>
  days < 0 ? `Scaduto da ${-days} ${days === -1 ? "giorno" : "giorni"}` : days === 0 ? "Oggi" : days === 1 ? "Domani" : `Tra ${days} giorni`;
const relativeDay = (isoTs, todayISO) => {
  if (!isoTs) return null;
  const d = localISODate(new Date(isoTs));
  const diff = daysUntil(isoToDate(d), todayISO);
  if (diff === 0) return "oggi";
  if (diff === -1) return "ieri";
  if (diff > -7) return `${-diff} giorni fa`;
  return `il ${fmtDateShort(d)}`;
};

const freqHelpText = (frequency, refDate) => {
  if (!refDate) return "";
  const d = isoToDate(refDate);
  if (frequency === "settimanale") return `Si ripete ogni ${intl({ weekday: "long" }).format(d)}`;
  if (frequency === "mensile") return `Si ripete ogni mese il giorno ${d.getDate()}`;
  return `Si ripete ogni anno il ${intl({ day: "numeric", month: "long" }).format(d)}`;
};

const monthlyEquivalent = (item) => {
  if (item.frequency === "mensile") return item.amount;
  if (item.frequency === "annuale") return item.amount / 12;
  return (item.amount * 52) / 12;
};

/* ---------- Importazione Wallet ---------- */
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36) + s.length.toString(36);
}

function parseWalletAmount(raw) {
  if (raw == null) return 0;
  let s = String(raw).replace(/[^\d,.]/g, "");
  if (!s) return 0;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) {
    const dec = lc > ld ? "," : ".";
    const th = dec === "," ? "." : ",";
    s = s.split(th).join("").replace(dec, ".");
  } else if (lc > -1) {
    s = s.replace(",", ".");
  } else if (ld > -1) {
    const parts = s.split(".");
    if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3)) s = parts.join("");
  }
  const n = parseFloat(s);
  return isFinite(n) ? round2(Math.abs(n)) : 0;
}

function parseWalletDate(raw, todayISO) {
  const m = String(raw || "").match(/(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2})[:.](\d{2}))?/);
  if (m) return { date: `${m[1]}-${m[2]}-${m[3]}`, time: m[4] ? `${m[4].padStart(2, "0")}:${m[5]}` : "" };
  const t = Date.parse(raw);
  if (!isNaN(t)) {
    const d = new Date(t);
    return { date: localISODate(d), time: `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` };
  }
  return { date: todayISO, time: "" };
}

function parseWalletFile(text, seen, todayISO) {
  const items = [];
  const batch = new Set();
  let valid = 0;
  String(text).split(/\r?\n/).forEach((rawLine) => {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) return;
    const parts = line.split("|").map((p) => p.trim());
    if (parts.length < 3) return;
    valid++;
    const hash = hashStr(line);
    if (seen.has(hash) || batch.has(hash)) return;
    batch.add(hash);
    const { date, time } = parseWalletDate(parts[0], todayISO);
    items.push({ hash, date: date > todayISO ? todayISO : date, time, merchant: parts[1] || "", amount: parseWalletAmount(parts[2]), card: parts[3] || "" });
  });
  items.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  return { items, valid };
}

/* ---------- Ricorrenze ---------- */
function nextRenewal(item, from) {
  const ref = isoToDate(item.refDate);
  const start = new Date(from);
  start.setHours(0, 0, 0, 0);
  if (item.frequency === "settimanale") {
    const cand = new Date(start);
    cand.setDate(cand.getDate() + ((ref.getDay() - start.getDay() + 7) % 7));
    return cand;
  }
  const day = ref.getDate();
  if (item.frequency === "mensile") {
    let y = start.getFullYear(), m = start.getMonth();
    let cand = new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
    if (cand < start) {
      m += 1;
      if (m > 11) { m = 0; y += 1; }
      cand = new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
    }
    return cand;
  }
  const month = ref.getMonth();
  let y = start.getFullYear();
  let cand = new Date(y, month, Math.min(day, new Date(y, month + 1, 0).getDate()));
  if (cand < start) {
    y += 1;
    cand = new Date(y, month, Math.min(day, new Date(y, month + 1, 0).getDate()));
  }
  return cand;
}

function occurrenceAfter(item, date) {
  const next = new Date(date);
  next.setDate(next.getDate() + 1);
  return nextRenewal(item, next);
}

function occurrencesInRange(item, fromISO, toISO) {
  const out = [];
  if (fromISO > toISO) return out;
  const end = isoToDate(toISO);
  let d = nextRenewal(item, isoToDate(fromISO));
  let guard = 0;
  while (d <= end && guard < 400) { out.push(localISODate(d)); d = occurrenceAfter(item, d); guard++; }
  return out;
}

function nextDue(item, todayISO) {
  let startISO = todayISO;
  if (item.processedThrough) {
    const afterPaid = addDaysISO(item.processedThrough, 1);
    startISO = item.auto ? maxISO(afterPaid, todayISO) : afterPaid;
  }
  return nextRenewal(item, isoToDate(startISO));
}

/* ---------- Saldi ---------- */
function applyBalance(accounts, accountId, delta) {
  if (!accountId) return accounts;
  return accounts.map((a) => (a.id === accountId ? { ...a, balance: round2(a.balance + delta) } : a));
}
function txEffects(t) {
  if (t.type === "transfer") return [[t.accountId, -t.amount], [t.toAccountId, t.amount]];
  return [[t.accountId, t.type === "income" ? t.amount : -t.amount]];
}
function applyEffects(accounts, effects, sign) {
  return effects.reduce((acc, [id, delta]) => applyBalance(acc, id, sign * delta), accounts);
}

function applyCatchUp(data, todayISO) {
  let count = 0;
  let transactions = data.transactions;
  let accounts = data.accounts;
  const end = isoToDate(todayISO);
  const recurring = data.recurring.map((item) => {
    if (!item.active || !item.auto) return item;
    const startISO = item.processedThrough ? addDaysISO(item.processedThrough, 1) : todayISO;
    let occ = nextRenewal(item, isoToDate(startISO));
    let processed = false;
    let guard = 0;
    while (occ <= end && guard < 520) {
      const isIncome = item.kind === "income";
      transactions = [...transactions, {
        id: uid("t"), type: item.kind, amount: item.amount,
        category: isIncome ? item.category : "abbonamenti",
        description: item.name, date: localISODate(occ), accountId: item.accountId || null,
      }];
      accounts = applyBalance(accounts, item.accountId, isIncome ? item.amount : -item.amount);
      count++;
      processed = true;
      occ = occurrenceAfter(item, occ);
      guard++;
    }
    return processed ? { ...item, processedThrough: todayISO } : item;
  });
  return { data: { ...data, transactions, recurring, accounts }, count };
}

const EMPTY_DATA = { transactions: [], recurring: [], accounts: [], budgets: {}, walletSeen: [], merchantMap: {}, cardMap: {}, walletLastImport: null };

const isObj = (o) => o && typeof o === "object" && !Array.isArray(o);
function normalize(p) {
  return {
    transactions: Array.isArray(p.transactions) ? p.transactions : [],
    recurring: Array.isArray(p.recurring) ? p.recurring : [],
    accounts: Array.isArray(p.accounts) ? p.accounts : [],
    budgets: isObj(p.budgets) ? p.budgets : {},
    walletSeen: Array.isArray(p.walletSeen) ? p.walletSeen : [],
    merchantMap: isObj(p.merchantMap) ? p.merchantMap : {},
    cardMap: isObj(p.cardMap) ? p.cardMap : {},
    walletLastImport: typeof p.walletLastImport === "string" ? p.walletLastImport : null,
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  return { ...EMPTY_DATA };
}

/* ---------- Tema per i grafici ---------- */
function readTheme() {
  const s = getComputedStyle(document.documentElement);
  const g = (n) => s.getPropertyValue(n).trim();
  return { ink: g("--ink"), muted: g("--muted"), line: g("--line"), green: g("--green"), red: g("--red"), ochre: g("--ochre"), blue: g("--blue"), surface: g("--surface") };
}
function useTheme() {
  const [t, setT] = useState(readTheme);
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const h = () => setT(readTheme());
    if (mq.addEventListener) mq.addEventListener("change", h); else mq.addListener(h);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", h); else mq.removeListener(h); };
  }, []);
  return t;
}

function Delta({ cur, prev, upIsGood }) {
  if (!prev && !cur) return null;
  if (!prev) return <span className="text-xs muted">nessun confronto</span>;
  const p = ((cur - prev) / Math.abs(prev)) * 100;
  if (Math.abs(p) < 1) return <span className="text-xs muted">stabile</span>;
  const up = p > 0;
  const good = upIsGood ? up : !up;
  return <span className={`text-xs font-medium num ${good ? "c-green" : "c-red"}`}>{up ? "▲" : "▼"} {Math.abs(p).toFixed(0)}%</span>;
}

function DiffAmount({ cur, prev, upIsGood }) {
  const diff = cur - prev;
  if (Math.abs(diff) < 0.5) return <span className="text-xs muted">stabile</span>;
  const good = upIsGood ? diff > 0 : diff < 0;
  return <span className={`text-xs font-medium num ${good ? "c-green" : "c-red"}`}>{diff > 0 ? "▲" : "▼"} {fmtEUR(Math.abs(diff))}</span>;
}

/* ---------- Elemento distintivo: il biglietto ---------- */
function Guilloche() {
  const paths = useMemo(() => {
    const out = [];
    for (let i = 0; i < 16; i++) {
      let d = "";
      for (let x = 0; x <= 400; x += 5) {
        const y = 24 + i * 11 + 6 * Math.sin(x / 23 + i * 0.6) + 3.5 * Math.sin(x / 9.5 - i * 0.35);
        d += (x === 0 ? "M" : "L") + x + " " + y.toFixed(1);
      }
      out.push(d);
    }
    for (let k = 0; k < 7; k++) {
      let d = "";
      for (let t = 0; t <= 360; t += 2) {
        const th = (t * Math.PI) / 180;
        const r = 46 + 10 * Math.sin(14 * th + k * 0.45) + k * 1.2;
        d += (t === 0 ? "M" : "L") + (330 + r * Math.cos(th)).toFixed(1) + " " + (64 + r * Math.sin(th)).toFixed(1);
      }
      out.push(d + "Z");
    }
    return out;
  }, []);
  return (
    <svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice" className="absolute inset-0 w-full h-full" aria-hidden="true">
      {paths.map((d, i) => <path key={i} d={d} fill="none" strokeWidth="0.7" style={{ stroke: "var(--note-line)", opacity: 0.55 }} />)}
    </svg>
  );
}

function BackupSection({ data, onImport }) {
  const fileRef = useRef(null);
  const [last, setLast] = useState(() => { try { return localStorage.getItem(BACKUP_KEY); } catch (e) { return null; } });
  const markDone = () => { const now = new Date().toISOString(); try { localStorage.setItem(BACKUP_KEY, now); } catch (e) {} setLast(now); };

  const doExport = async () => {
    const json = JSON.stringify({ app: "flussi-economici", version: 3, exportedAt: new Date().toISOString(), ...data }, null, 2);
    const name = `flussi-backup-${localISODate()}.json`;
    try {
      const file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Backup Flussi Economici" });
        markDone();
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    markDone();
  };

  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      const p = JSON.parse(await f.text());
      if (!Array.isArray(p.transactions) || !Array.isArray(p.recurring) || !Array.isArray(p.accounts)) throw new Error();
      if (window.confirm("Sostituire tutti i dati attuali con quelli del backup?")) onImport(normalize(p));
    } catch (err) { window.alert("Il file scelto non è un backup di Flussi Economici."); }
  };

  const stale = !last || (Date.now() - new Date(last).getTime()) / 86400000 > 30;
  return (
    <div className="panel p-4">
      <p className="text-sm muted mb-3">
        I dati restano solo su questo telefono. Ultimo backup:{" "}
        <span className={stale ? "c-ochre font-medium" : ""}>{last ? new Date(last).toLocaleDateString("it-IT") : "mai fatto"}</span>
      </p>
      <div className="grid grid-cols-2 gap-2">
        <button onClick={doExport} className="btn btn-ink flex items-center justify-center gap-2"><Download size={16} /> Esporta</button>
        <button onClick={() => fileRef.current && fileRef.current.click()} className="btn btn-ghost flex items-center justify-center gap-2"><Upload size={16} /> Importa</button>
      </div>
      <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={onFile} />
    </div>
  );
}

  const { transactions, recurring, accounts, budgets } = data;
  const curKey = monthKeyOf(todayISO);
  const prevKey = shiftMonth(curKey, -1);

  /* persistenza, data corrente, automatismi */
  useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {} }, [data]);
  useEffect(() => {
    const onVisible = () => { if (document.visibilityState === "visible") setTodayISO(localISODate()); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => { document.removeEventListener("visibilitychange", onVisible); window.removeEventListener("focus", onVisible); };
  }, []);
  useEffect(() => {

      setNote(count === 1 ? "Registrato 1 movimento ricorrente" : `Registrati ${count} movimenti ricorrenti`);

  }, [data.recurring, todayISO]);
  useEffect(() => { if (!note) return; const t = setTimeout(() => setNote(null), 5000); return () => clearTimeout(t); }, [note]);
  useEffect(() => { window.scrollTo(0, 0); }, [tab]);

  /* aggregati */
  const totalAccounts = useMemo(() => round2(accounts.reduce((s, a) => s + a.balance, 0)), [accounts]);

  const agg = useMemo(() => {
    const m = {};
    for (const t of transactions) {
      if (t.type === "transfer") continue;
      const k = monthKeyOf(t.date);
      const e = m[k] || (m[k] = { inc: 0, exp: 0, cat: {} });
      if (t.type === "income") e.inc += t.amount;
      else { e.exp += t.amount; e.cat[t.category] = (e.cat[t.category] || 0) + t.amount; }
    }
    return m;
  }, [transactions]);
  const getAgg = (k) => agg[k] || { inc: 0, exp: 0, cat: {} };

  const mtd = (type, key, limitDay) =>
    transactions.reduce((s, t) => (t.type === type && monthKeyOf(t.date) === key && isoToDate(t.date).getDate() <= limitDay ? s + t.amount : s), 0);
  const prevLimit = Math.min(dayNum, daysInMonth(prevKey));
  const expMTD = mtd("expense", curKey, dayNum);
  const expPrevMTD = mtd("expense", prevKey, prevLimit);
  const incMTD = mtd("income", curKey, dayNum);
  const incPrevMTD = mtd("income", prevKey, prevLimit);

  const recurringSorted = useMemo(() => recurring
    .map((r) => {
      if (!r.active) return { ...r, daysLeft: null, nextISO: null };
      const due = nextDue(r, todayISO);
      return { ...r, daysLeft: daysUntil(due, todayISO), nextISO: localISODate(due) };
    })
    .sort((a, b) => {
      if (a.active !== b.active) return a.active ? -1 : 1;
      if (a.daysLeft == null || b.daysLeft == null) return 0;
      return a.daysLeft - b.daysLeft;
    }), [recurring, todayISO]);

  const scheduledBetween = (fromISO, toISO) => {
    const out = [];
    recurring.forEach((item) => {
      if (!item.active) return;
      const due = localISODate(nextDue(item, todayISO));
      occurrencesInRange(item, maxISO(due, fromISO), toISO).forEach((date) => out.push({ item, date }));
    });
    return out.sort((a, b) => a.date.localeCompare(b.date));
  };

  const monthSched = useMemo(() => scheduledBetween(monthStartISO(curKey), monthEndISO(curKey)), [recurring, todayISO]);
  const next7 = useMemo(() => scheduledBetween("1970-01-01", addDaysISO(todayISO, 7)), [recurring, todayISO]);
  const projected = round2(totalAccounts + monthSched.reduce((s, x) => s + (x.item.kind === "income" ? x.item.amount : -x.item.amount), 0));
  const curAgg = getAgg(curKey);
  const savingsCur = curAgg.inc - curAgg.exp;

  const budgetRows = EXPENSE_CATEGORIES.map((c) => ({ ...c, limit: budgets[c.id] || 0, spent: curAgg.cat[c.id] || 0 }));
  const budgetAlerts = budgetRows.filter((r) => r.limit > 0 && r.spent >= r.limit * 0.8);

  /* azioni sui dati */
  const saveTx = (tx, old) => {
    setData((d) => {
      let acc = d.accounts;
      if (old) acc = applyEffects(acc, txEffects(old), -1);
      acc = applyEffects(acc, txEffects(tx), 1);
      const txs = old ? d.transactions.map((t) => (t.id === tx.id ? tx : t)) : [...d.transactions, tx];
      return { ...d, transactions: txs, accounts: acc };
    });
    setTxModal(null); setTrModal(null);
    setNote(old ? "Movimento aggiornato" : tx.type === "transfer" ? "Giroconto registrato" : "Movimento registrato");
  };
  const deleteTx = (tx) => {
    setData((d) => ({ ...d, transactions: d.transactions.filter((t) => t.id !== tx.id), accounts: applyEffects(d.accounts, txEffects(tx), -1) }));
    setTxModal(null); setTrModal(null);
    setNote("Movimento eliminato");
  };
  const openTx = (tx) => (tx.type === "transfer" ? setTrModal({ tx }) : setTxModal({ tx }));

  const setRecurring = (f) => setData((d) => ({ ...d, recurring: f(d.recurring) }));
  const saveRecurring = (item) => {
    setRecurring((prev) => {
      const old = prev.find((r) => r.id === item.id);
      let processedThrough = yesterdayISO;
      if (old) {
        const base = old.processedThrough || yesterdayISO;
        if (old.refDate !== item.refDate || old.frequency !== item.frequency) processedThrough = yesterdayISO;
        else if (item.auto && !old.auto) processedThrough = maxISO(base, yesterdayISO);
        else processedThrough = base;
      }
      const next = { ...item, processedThrough };
      return old ? prev.map((r) => (r.id === item.id ? next : r)) : [...prev, next];
    });
    setRecModal(null);
  };
  const deleteRecurring = (id) => { setRecurring((prev) => prev.filter((r) => r.id !== id)); setRecModal(null); };
  const toggleRec = (id, field) => setRecurring((prev) => prev.map((r) => {
    if (r.id !== id) return r;
    const val = !r[field];
    return val ? { ...r, [field]: val, processedThrough: maxISO(r.processedThrough || yesterdayISO, yesterdayISO) } : { ...r, [field]: val };
  }));
  const markRecurringPaid = (item) => {
    const isIncome = item.kind === "income";
    const date = item.nextISO < todayISO ? item.nextISO : todayISO;
    setData((d) => ({
      ...d,
      transactions: [...d.transactions, { id: uid("t"), type: item.kind, amount: item.amount, category: isIncome ? item.category : "abbonamenti", description: item.name, date, accountId: item.accountId || null }],
      accounts: applyBalance(d.accounts, item.accountId, isIncome ? item.amount : -item.amount),
      recurring: d.recurring.map((r) => (r.id === item.id ? { ...r, processedThrough: item.nextISO } : r)),
    }));
    setNote(isIncome ? "Entrata registrata" : "Pagamento registrato");
  };

  const saveAccount = (acc) => {
    setData((d) => ({ ...d, accounts: d.accounts.some((a) => a.id === acc.id) ? d.accounts.map((a) => (a.id === acc.id ? acc : a)) : [...d.accounts, acc] }));
    setAccModal(null);
  };
  const deleteAccount = (id) => { setData((d) => ({ ...d, accounts: d.accounts.filter((a) => a.id !== id) })); setAccModal(null); };

  const setBudget = (catId, value) => {
    setData((d) => {
      const b = { ...d.budgets };
      if (value > 0) b[catId] = value; else delete b[catId];
      return { ...d, budgets: b };
    });
    setBudgetModal(null);
  };

  /* Wallet */
  const openWalletPicker = () => { if (walletRef.current) walletRef.current.click(); };
  const onWalletFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    let text = "";
    try { text = await f.text(); } catch (err) { window.alert("Impossibile leggere il file scelto."); return; }
    const { items, valid } = parseWalletFile(text, new Set(data.walletSeen), todayISO);
    if (!valid) {
      window.alert("Il file non contiene pagamenti nel formato previsto. Controlla il comando rapido: ogni riga deve essere data|esercente|importo|carta.");
      return;
    }
    if (!items.length) {
      setData((d) => ({ ...d, walletLastImport: new Date().toISOString() }));
      setNote("Nessun nuovo pagamento da importare");
      return;
    }
    const enriched = items.map((it) => ({
      ...it,
      category: data.merchantMap[it.merchant.toLowerCase()] || "altro-u",
      accountId: (it.card && data.cardMap[it.card] && accounts.some((a) => a.id === data.cardMap[it.card])) ? data.cardMap[it.card] : accounts.length === 1 ? accounts[0].id : "",
    }));
    setWalletReview(enriched);
  };
  const confirmWallet = (rows) => {
    const inc = rows.filter((r) => r.include && r.amount > 0);
    setData((d) => {
      let txs = [...d.transactions];
      let acc = d.accounts;
      const mm = { ...d.merchantMap }, cm = { ...d.cardMap };
      inc.forEach((r) => {
        const tx = { id: uid("t"), type: "expense", amount: r.amount, category: r.category, description: r.merchant || "Pagamento con Wallet", date: r.date, accountId: r.accountId || null, source: "wallet" };
        txs.push(tx);
        acc = applyBalance(acc, tx.accountId, -tx.amount);
        if (r.merchant) mm[r.merchant.toLowerCase()] = r.category;
        if (r.card && r.accountId) cm[r.card] = r.accountId;
      });
      return { ...d, transactions: txs, accounts: acc, merchantMap: mm, cardMap: cm, walletSeen: [...d.walletSeen, ...rows.map((r) => r.hash)], walletLastImport: new Date().toISOString() };
    });
    setWalletReview(null);
    setNote(inc.length === 1 ? "1 pagamento importato da Wallet" : `${inc.length} pagamenti importati da Wallet`);
  };
  const ignoreWallet = () => {
    const hashes = walletReview.map((r) => r.hash);
    setData((d) => ({ ...d, walletSeen: [...d.walletSeen, ...hashes], walletLastImport: new Date().toISOString() }));
    setWalletReview(null);
    setNote("Pagamenti segnati come già registrati");
  };
  const walletLastLabel = data.walletLastImport ? `Ultima importazione ${relativeDay(data.walletLastImport, todayISO)}` : "Pagamenti con iPhone, in un tocco";

  const pickAdd = (id) => {
    setAddSheet(false);
    if (id === "expense" || id === "income") setTxModal({ tx: null, type: id });
    else if (id === "wallet") openWalletPicker();
    else if (id === "transfer") setTrModal({ tx: null });
    else if (id === "rec-expense") setRecModal({ item: null, kind: "expense" });
    else if (id === "rec-income") setRecModal({ item: null, kind: "income" });
    else if (id === "account") setAccModal({ acc: null });
  };

  /* ---------- Oggi ---------- */
  const steps = [
    { done: accounts.length > 0, title: "Aggiungi i tuoi conti", text: "Con il saldo di oggi: banca, carta, contanti.", go: () => setAccModal({ acc: null }) },
    { done: recurring.length > 0, title: "Inserisci le spese e le entrate fisse", text: "Affitto, abbonamenti, borsa di studio. Si registrano da sole.", go: () => setRecModal({ item: null, kind: "expense" }) },
    { done: transactions.length > 0, title: "Registra il primo movimento", text: "Ogni spesa collegata a un conto ne aggiorna il saldo.", go: () => setTxModal({ tx: null, type: "expense" }) },
  ];
  const showSteps = steps.some((s) => !s.done);
  const recentTx = useMemo(() => [...transactions].sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1)).slice(0, 5), [transactions]);

  const renderOverview = () => (
    <div>
      <header className="mb-4">
        <div className="text-sm muted">{cap(fmtDayLong(todayISO))}</div>
        <h1 className="serif text-[32px] leading-tight">{cap(monthLabel(curKey))}</h1>
      </header>

      <div className="relative overflow-hidden" style={{ background: "var(--note)", color: "var(--note-ink)", borderRadius: 22 }}>
        <Guilloche />
        <div className="relative p-5">
          <div className="text-sm" style={{ color: "var(--note-soft)" }}>Disponibile sui conti</div>
          {accounts.length ? (
            <div className="serif num mt-1" style={{ fontSize: 42, lineHeight: 1.05 }}>{fmtEUR(totalAccounts)}</div>
          ) : (
            <button onClick={() => setAccModal({ acc: null })} className="serif text-[26px] mt-1 text-left underline underline-offset-4">Aggiungi un conto</button>
          )}
          <div className="grid grid-cols-2 gap-4 mt-6">
            <div>
              <div className="text-xs" style={{ color: "var(--note-soft)" }}>Previsto a fine {monthName(curKey)}</div>
              <div className="num text-lg font-semibold mt-0.5">{fmtEUR(projected)}</div>
            </div>
            <div>
              <div className="text-xs" style={{ color: "var(--note-soft)" }}>Risparmio di {monthName(curKey)}</div>
              <div className="num text-lg font-semibold mt-0.5">{fmtSigned(savingsCur)}</div>
            </div>
          </div>
        </div>
      </div>

      <div className="mt-3">
        <WalletButton lastLabel={walletLastLabel} onClick={openWalletPicker} />
        {!data.walletLastImport && (
          <button onClick={() => setWalletGuide(true)} className="text-sm c-blue mt-2 px-1">Come si configura</button>
        )}
      </div>

      {showSteps && (
        <Section title="Per iniziare">
          <Rows>
            {steps.map((s, i) => (
              <button key={i} onClick={s.go} className="w-full flex items-start gap-3 py-3 text-left" disabled={s.done}>
                <span className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 text-sm font-semibold num"
                  style={{ background: s.done ? "var(--green)" : "var(--surface2)", color: s.done ? "var(--surface)" : "var(--ink)" }}>
                  {s.done ? <Check size={15} /> : i + 1}
                </span>
                <span>
                  <span className="block text-[15px] font-medium" style={{ textDecoration: s.done ? "line-through" : "none", color: s.done ? "var(--muted)" : "var(--ink)" }}>{s.title}</span>
                  {!s.done && <span className="block text-xs muted mt-0.5">{s.text}</span>}
                </span>
              </button>
            ))}
          </Rows>
        </Section>
      )}

      <Section title="Questo mese, fino a oggi">
        <div className="panel grid grid-cols-2">
          <div className="p-4" style={{ borderRight: "1px solid var(--line)" }}>
            <div className="text-sm muted">Uscite</div>
            <div className="num text-[22px] font-semibold mt-0.5">{fmtEUR(expMTD)}</div>
            <div className="mt-1"><Delta cur={expMTD} prev={expPrevMTD} upIsGood={false} /></div>
            <div className="text-xs muted mt-1 num">{fmtEUR(expPrevMTD)} a {monthName(prevKey)} alla stessa data</div>
          </div>
          <div className="p-4">
            <div className="text-sm muted">Entrate</div>
            <div className="num text-[22px] font-semibold mt-0.5 c-green">{fmtEUR(incMTD)}</div>
            <div className="mt-1"><Delta cur={incMTD} prev={incPrevMTD} upIsGood={true} /></div>
            <div className="text-xs muted mt-1 num">{fmtEUR(incPrevMTD)} a {monthName(prevKey)} alla stessa data</div>
          </div>
        </div>
      </Section>

      {budgetAlerts.length > 0 && (
        <Section title="Budget quasi esauriti" action={<button onClick={() => setTab("analysis")} className="text-sm c-blue">Tutti i budget</button>}>
          <Rows>{budgetAlerts.map((r) => <BudgetRow key={r.id} r={r} onClick={() => setBudgetModal({ cat: r })} />)}</Rows>
        </Section>
      )}

      <Section title="Prossimi 7 giorni" action={<button onClick={() => { setCalMonth(curKey); setSelDay(todayISO); setTab("schedule"); }} className="text-sm c-blue">Calendario</button>}>
        {next7.length ? (
          <Rows>{next7.map((s, i) => <ScheduledRow key={`${s.item.id}-${s.date}-${i}`} s={s} todayISO={todayISO} onClick={() => setRecModal({ item: recurring.find((r) => r.id === s.item.id) })} />)}</Rows>
        ) : (
          <p className="text-sm muted">Nessun pagamento o accredito in programma.</p>
        )}
      </Section>

      <Section title="Ultimi movimenti" action={transactions.length > 0 && <button onClick={() => { setMovMonth(curKey); setTab("movements"); }} className="text-sm c-blue">Vedi tutti</button>}>
        {recentTx.length ? (
          <Rows>{recentTx.map((t) => <TxRow key={t.id} tx={t} accounts={accounts} onClick={() => openTx(t)} />)}</Rows>
        ) : (
          <p className="text-sm muted">Ancora nessun movimento. Usa il pulsante + per registrare la prima spesa.</p>
        )}
      </Section>
    </div>
  );

  /* ---------- Movimenti ---------- */
  const q = search.trim().toLowerCase();
  const movBase = useMemo(() => (q ? transactions : transactions.filter((t) => monthKeyOf(t.date) === movMonth)), [transactions, movMonth, q]);
  const movFiltered = useMemo(() => movBase
    .filter((t) => typeFilter === "all" || t.type === typeFilter)
    .filter((t) => !catFilter || t.category === catFilter)
    .filter((t) => {
      if (!q) return true;
      const label = t.type === "transfer" ? "giroconto" : catMeta(t.type, t.category).label.toLowerCase();
      return (t.description || "").toLowerCase().includes(q) || label.includes(q);
    })
    .sort((a, b) => b.date.localeCompare(a.date)), [movBase, typeFilter, catFilter, q]);
  const movGroups = useMemo(() => {
    const g = [];
    movFiltered.forEach((t) => {
      const last = g[g.length - 1];
      if (last && last.date === t.date) last.items.push(t); else g.push({ date: t.date, items: [t] });
    });
    return g;
  }, [movFiltered]);
  const movAgg = getAgg(movMonth);

  const renderMovements = () => (
    <div>
      <h1 className="serif text-[32px] leading-tight mb-2">Movimenti</h1>
      {!q && <MonthNav monthKey={movMonth} onChange={setMovMonth} max={curKey} />}
      {!q && (
        <div className="panel grid grid-cols-3 mt-2">
          {[["Entrate", fmtEUR(movAgg.inc), "c-green"], ["Uscite", fmtEUR(movAgg.exp), ""], ["Saldo", fmtSigned(movAgg.inc - movAgg.exp), movAgg.inc - movAgg.exp < 0 ? "c-red" : ""]].map(([l, v, c], i) => (
            <div key={l} className="py-3 px-3" style={i ? { borderLeft: "1px solid var(--line)" } : null}>
              <div className="text-xs muted">{l}</div>
              <div className={`num text-[15px] font-semibold mt-0.5 ${c}`}>{v}</div>
            </div>
          ))}
        </div>
      )}
      <div className="relative mt-4">
        <span className="absolute muted" style={{ left: 12, top: 13 }}><Search size={18} /></span>
        <input className="inp" style={{ paddingLeft: 38 }} value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Cerca in tutti i mesi" />
      </div>
      <div className="flex gap-2 overflow-x-auto noscroll mt-3 -mx-4 px-4">
        {[["all", "Tutti"], ["expense", "Uscite"], ["income", "Entrate"], ["transfer", "Giroconti"]].map(([id, l]) => (
          <button key={id} onClick={() => { setTypeFilter(id); setCatFilter(null); }} className={`chip ${typeFilter === id ? "chip-on" : ""}`}>{l}</button>
        ))}
      </div>
      {(typeFilter === "expense" || typeFilter === "income") && (
        <div className="flex gap-2 overflow-x-auto noscroll mt-2 -mx-4 px-4">
          {(typeFilter === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map((c) => (
            <button key={c.id} onClick={() => setCatFilter(catFilter === c.id ? null : c.id)} className={`chip ${catFilter === c.id ? "chip-on" : ""}`}>{c.label}</button>
          ))}
        </div>
      )}
      {q && <p className="text-xs muted mt-3">{movFiltered.length} risultati in tutti i mesi</p>}
      {movGroups.length ? movGroups.map((g) => {
        const net = g.items.reduce((s, t) => s + (t.type === "income" ? t.amount : t.type === "expense" ? -t.amount : 0), 0);
        return (
          <div key={g.date} className="mt-5">
            <div className="flex justify-between text-sm muted mb-1.5 px-1">
              <span>{cap(fmtDayLong(g.date))}{q ? ` ${g.date.slice(0, 4)}` : ""}</span>
              <span className="num">{Math.abs(net) > 0.004 ? fmtSigned(net) : ""}</span>
            </div>
            <Rows>{g.items.map((t) => <TxRow key={t.id} tx={t} accounts={accounts} onClick={() => openTx(t)} />)}</Rows>
          </div>
        );
      }) : (
        <div className="mt-8 text-center">
          <p className="text-[15px] muted">{movBase.length ? "Nessun movimento corrisponde ai filtri." : `Nessun movimento a ${monthName(movMonth)}.`}</p>
          {!movBase.length && !q && <button onClick={() => setTxModal({ tx: null, type: "expense" })} className="btn btn-ghost mt-4 mx-auto" style={{ width: "auto", display: "inline-block" }}>Registra una spesa</button>}
        </div>
      )}
    </div>
  );

  /* ---------- Scadenze ---------- */
  const calCells = useMemo(() => {
    const first = keyToDate(calMonth);
    const lead = (first.getDay() + 6) % 7;
    const cells = Array(lead).fill(null);
    for (let d = 1; d <= daysInMonth(calMonth); d++) cells.push(`${calMonth}-${String(d).padStart(2, "0")}`);
    return cells;
  }, [calMonth]);
  const actualsByDay = useMemo(() => {
    const m = {};
    transactions.forEach((t) => { if (monthKeyOf(t.date) === calMonth) (m[t.date] = m[t.date] || []).push(t); });
    return m;
  }, [transactions, calMonth]);
  const calSched = useMemo(() => scheduledBetween(monthStartISO(calMonth), monthEndISO(calMonth)), [recurring, todayISO, calMonth]);
  const calSchedByDay = useMemo(() => {
    const m = {};
    calSched.forEach((s) => { (m[s.date] = m[s.date] || []).push(s); });
    return m;
  }, [calSched]);
  const calAgg = getAgg(calMonth);
  const schedOut = calSched.filter((s) => s.item.kind === "expense").reduce((s, x) => s + x.item.amount, 0);
  const schedIn = calSched.filter((s) => s.item.kind === "income").reduce((s, x) => s + x.item.amount, 0);
  const selActs = selDay ? actualsByDay[selDay] || [] : [];
  const selSched = selDay ? calSchedByDay[selDay] || [] : [];
  const recList = recurringSorted.filter((r) => r.kind === recView);
  const recMonthly = recList.filter((r) => r.active).reduce((s, r) => s + monthlyEquivalent(r), 0);

  const renderSchedule = () => (
    <div>
      <h1 className="serif text-[32px] leading-tight mb-2">Scadenze</h1>
      <MonthNav monthKey={calMonth} onChange={(k) => { setCalMonth(k); setSelDay(k === curKey ? todayISO : null); }} />
      <div className="panel p-2.5 mt-2">
        <div className="grid grid-cols-7 text-center text-xs muted mb-1">
          {["L", "M", "M", "G", "V", "S", "D"].map((d, i) => <span key={i}>{d}</span>)}
        </div>
        <div className="grid grid-cols-7 gap-y-1">
          {calCells.map((iso, i) => {
            if (!iso) return <span key={`b${i}`} />;
            const acts = actualsByDay[iso] || [];
            const sch = calSchedByDay[iso] || [];
            const hasExp = acts.some((t) => t.type === "expense");
            const hasInc = acts.some((t) => t.type === "income");
            const overdue = sch.some((s) => s.date < todayISO);
            const sel = iso === selDay;
            const isToday = iso === todayISO;
            return (
              <button key={iso} onClick={() => setSelDay(iso)} className="flex flex-col items-center justify-center rounded-xl" aria-label={fmtDayLong(iso)}
                style={{ height: 46, background: sel ? "var(--ink)" : "transparent", color: sel ? "var(--paper)" : iso < todayISO ? "var(--muted)" : "var(--ink)", boxShadow: isToday && !sel ? "inset 0 0 0 1.5px var(--ink)" : "none" }}>
                <span className="text-[15px] num leading-none">{Number(iso.slice(8))}</span>
                <span className="flex gap-[3px] mt-1.5" style={{ height: 6 }}>
                  {hasExp && <span style={{ width: 6, height: 6, borderRadius: 9, background: "var(--red)" }} />}
                  {hasInc && <span style={{ width: 6, height: 6, borderRadius: 9, background: "var(--green)" }} />}
                  {sch.length > 0 && <span style={{ width: 6, height: 6, borderRadius: 9, boxShadow: `inset 0 0 0 1.5px ${overdue ? "var(--red)" : "var(--ochre)"}` }} />}
                </span>
              </button>
            );
          })}
        </div>
      </div>
      <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs muted mt-2 px-1">
        <span className="flex items-center gap-1.5"><span style={{ width: 7, height: 7, borderRadius: 9, background: "var(--red)" }} />uscita registrata</span>
        <span className="flex items-center gap-1.5"><span style={{ width: 7, height: 7, borderRadius: 9, background: "var(--green)" }} />entrata registrata</span>
        <span className="flex items-center gap-1.5"><span style={{ width: 7, height: 7, borderRadius: 9, boxShadow: "inset 0 0 0 1.5px var(--ochre)" }} />in programma</span>
      </div>

      <Section title={selDay && monthKeyOf(selDay) === calMonth ? cap(fmtDayLong(selDay)) : "Dettaglio del giorno"} className="mt-6">
        {!selDay || monthKeyOf(selDay) !== calMonth ? (
          <p className="text-sm muted">Tocca un giorno del calendario.</p>
        ) : selSched.length || selActs.length ? (
          <Rows>
            {selSched.map((s, i) => <ScheduledRow key={`s${i}`} s={s} todayISO={todayISO} onClick={() => setRecModal({ item: recurring.find((r) => r.id === s.item.id) })} />)}
            {selActs.map((t) => <TxRow key={t.id} tx={t} accounts={accounts} onClick={() => openTx(t)} />)}
          </Rows>
        ) : (
          <p className="text-sm muted">Nessun movimento né scadenza in questo giorno.</p>
        )}
      </Section>

      <Section title={`Il mese di ${monthName(calMonth)}`}>
        <div className="panel grid grid-cols-2">
          <div className="p-4" style={{ borderRight: "1px solid var(--line)" }}>
            <div className="text-sm muted">Registrato</div>
            <div className="num text-[15px] mt-1">−{fmtEUR(calAgg.exp)}</div>
            <div className="num text-[15px] c-green">+{fmtEUR(calAgg.inc)}</div>
          </div>
          <div className="p-4">
            <div className="text-sm muted">Ancora in programma</div>
            <div className="num text-[15px] mt-1">−{fmtEUR(schedOut)}</div>
            <div className="num text-[15px] c-green">+{fmtEUR(schedIn)}</div>
          </div>
        </div>
      </Section>

      <Section title="Spese ed entrate fisse">
        <div className="seg">
          <button className={recView === "expense" ? "on" : ""} onClick={() => setRecView("expense")}>Spese fisse</button>
          <button className={recView === "income" ? "on" : ""} onClick={() => setRecView("income")}>Entrate fisse</button>
        </div>
        {recList.length > 0 && (
          <p className="text-sm muted mt-3 num">
            {recList.filter((r) => r.active).length} attive: {fmtEUR(recMonthly)} al mese, {fmtEUR(recMonthly * 12)} all'anno
          </p>
        )}
        <div className="space-y-2.5 mt-3">
          {recList.map((r) => (
            <RecurringItem key={r.id} item={r} accounts={accounts}
              onEdit={() => setRecModal({ item: recurring.find((x) => x.id === r.id) })}
              onToggleActive={() => toggleRec(r.id, "active")}
              onToggleAuto={() => toggleRec(r.id, "auto")}
              onMarkPaid={() => markRecurringPaid(r)} />
          ))}
        </div>
        {!recList.length && <p className="text-sm muted mt-3">{recView === "expense" ? "Nessuna spesa fissa inserita." : "Nessuna entrata fissa inserita."}</p>}
        <button onClick={() => setRecModal({ item: null, kind: recView })} className="btn btn-ghost mt-3">
          {recView === "expense" ? "Aggiungi spesa fissa" : "Aggiungi entrata fissa"}
        </button>
      </Section>
    </div>
  );

  /* ---------- Analisi ---------- */
  const series = useMemo(() => {
    const arr = [];
    for (let i = anPeriod - 1; i >= 0; i--) {
      const k = shiftMonth(curKey, -i);
      const a = getAgg(k);
      arr.push({ key: k, label: shortMonth(k), Entrate: round2(a.inc), Uscite: round2(a.exp), Saldo: round2(a.inc - a.exp) });
    }
    return arr;
  }, [agg, anPeriod, curKey]);
  const completeMonths = series.filter((s) => s.key < curKey);
  const avgBase = completeMonths.length ? completeMonths : series;
  const avg = (f) => avgBase.reduce((s, x) => s + x[f], 0) / avgBase.length;

  const anAgg = getAgg(anMonth);
  const anPrevKey = shiftMonth(anMonth, -1);
  const anPrev = getAgg(anPrevKey);
  const rate = (a) => (a.inc > 0 ? ((a.inc - a.exp) / a.inc) * 100 : null);
  const rCur = rate(anAgg), rPrev = rate(anPrev);

  const pace = useMemo(() => {
    const daily = (key) => {
      const arr = new Array(32).fill(0);
      transactions.forEach((t) => { if (t.type === "expense" && monthKeyOf(t.date) === key) arr[isoToDate(t.date).getDate()] += t.amount; });
      return arr;
    };
    const dim = daysInMonth(anMonth), pdim = daysInMonth(anPrevKey);
    const curLen = anMonth === curKey ? dayNum : dim;
    const a = daily(anMonth), b = daily(anPrevKey);
    const rows = [];
    let ca = 0, cb = 0;
    for (let d = 1; d <= Math.max(dim, pdim); d++) {
      if (d <= dim) ca += a[d];
      if (d <= pdim) cb += b[d];
      rows.push({ day: d, cur: d <= curLen ? round2(ca) : null, prev: d <= pdim ? round2(cb) : null });
    }
    return { rows, curLen, atDayCur: rows[curLen - 1]?.cur ?? 0, atDayPrev: rows[Math.min(curLen, pdim) - 1]?.prev ?? 0 };
  }, [transactions, anMonth, curKey, dayNum]);

  const catRows = useMemo(() => {
    const ids = new Set([...Object.keys(anAgg.cat), ...Object.keys(anPrev.cat)]);
    return [...ids].map((id) => {
      const m = catMeta("expense", id);
      return { id, label: m.label, color: m.color, cur: anAgg.cat[id] || 0, prev: anPrev.cat[id] || 0 };
    }).sort((a, b) => b.cur - a.cur || b.prev - a.prev);
  }, [anAgg, anPrev]);
  const donut = catRows.filter((r) => r.cur > 0);
  const selRow = catRows.find((r) => r.id === selCat);
  const catSeries = useMemo(() => (selCat ? series.map((s) => ({ label: s.label, key: s.key, value: round2(getAgg(s.key).cat[selCat] || 0) })) : []), [selCat, series]);
  const catAvg = catSeries.length ? catSeries.reduce((s, x) => s + x.value, 0) / catSeries.length : 0;

  const tickStyle = { fill: theme.muted, fontSize: 11 };
  const noCharts = <p className="text-sm muted p-4">Grafici non disponibili: la libreria non si è caricata. Ricarica l'app con la connessione attiva.</p>;

  const renderAnalysis = () => (
    <div>
      <h1 className="serif text-[32px] leading-tight mb-3">Analisi</h1>
      <div className="flex gap-2">
        {[3, 6, 12].map((n) => <button key={n} onClick={() => setAnPeriod(n)} className={`chip ${anPeriod === n ? "chip-on" : ""}`}>{n} mesi</button>)}
      </div>

      <Section title="Entrate e uscite" className="mt-5">
        <div className="panel pt-4 pr-2 pb-1">
          {!RC ? noCharts : (
            <RC.ResponsiveContainer width="100%" height={230}>
              <RC.ComposedChart data={series} margin={{ top: 4, right: 6, left: 0, bottom: 0 }}>
                <RC.CartesianGrid stroke={theme.line} vertical={false} />
                <RC.XAxis dataKey="label" tick={tickStyle} axisLine={false} tickLine={false} />
                <RC.YAxis tick={tickStyle} axisLine={false} tickLine={false} width={40} tickFormatter={compactEUR} />
                <RC.Tooltip content={<ChartTip />} cursor={{ fill: theme.line, opacity: 0.35 }} />
                <RC.Bar dataKey="Entrate" fill={theme.green} radius={[4, 4, 0, 0]} onClick={(_, i) => setAnMonth(series[i].key)}>
                  {series.map((s) => <RC.Cell key={s.key} fill={theme.green} fillOpacity={s.key === anMonth ? 1 : 0.4} />)}
                </RC.Bar>
                <RC.Bar dataKey="Uscite" fill={theme.red} radius={[4, 4, 0, 0]} onClick={(_, i) => setAnMonth(series[i].key)}>
                  {series.map((s) => <RC.Cell key={s.key} fill={theme.red} fillOpacity={s.key === anMonth ? 1 : 0.4} />)}
                </RC.Bar>
                <RC.Line type="monotone" dataKey="Saldo" stroke={theme.ink} strokeWidth={2} dot={{ r: 2.5, fill: theme.ink, strokeWidth: 0 }} />
              </RC.ComposedChart>
            </RC.ResponsiveContainer>
          )}
        </div>
        <p className="text-xs muted mt-2">Tocca le barre di un mese per esaminarlo qui sotto. La linea è il saldo tra entrate e uscite.</p>
        <div className="panel grid grid-cols-3 mt-3">
          {[["Uscite medie", fmtEUR(avg("Uscite")), ""], ["Entrate medie", fmtEUR(avg("Entrate")), "c-green"], ["Saldo medio", fmtSigned(avg("Saldo")), avg("Saldo") < 0 ? "c-red" : ""]].map(([l, v, c], i) => (
            <div key={l} className="py-3 px-3" style={i ? { borderLeft: "1px solid var(--line)" } : null}>
              <div className="text-xs muted">{l}</div>
              <div className={`num text-[14px] font-semibold mt-0.5 ${c}`}>{v}</div>
            </div>
          ))}
        </div>
        <p className="text-xs muted mt-1.5">Medie calcolate sui mesi conclusi del periodo.</p>
      </Section>

      <div className="mt-9 pt-2" style={{ borderTop: "1px solid var(--line)" }}>
        <MonthNav monthKey={anMonth} onChange={(k) => { setAnMonth(k); }} max={curKey} />
      </div>

      <Section title={`Rispetto a ${monthName(anPrevKey)}`} className="mt-3">
        <Rows>
          {[
            ["Uscite", fmtEUR(anAgg.exp), `prima ${fmtEUR(anPrev.exp)}`, <Delta cur={anAgg.exp} prev={anPrev.exp} upIsGood={false} />],
            ["Entrate", fmtEUR(anAgg.inc), `prima ${fmtEUR(anPrev.inc)}`, <Delta cur={anAgg.inc} prev={anPrev.inc} upIsGood={true} />],
            ["Risparmio", fmtSigned(anAgg.inc - anAgg.exp), `prima ${fmtSigned(anPrev.inc - anPrev.exp)}`, <DiffAmount cur={anAgg.inc - anAgg.exp} prev={anPrev.inc - anPrev.exp} upIsGood={true} />],
            ["Quota risparmiata", rCur == null ? "n.d." : `${rCur.toFixed(0)}%`, `prima ${rPrev == null ? "n.d." : `${rPrev.toFixed(0)}%`}`,
              rCur != null && rPrev != null && Math.abs(rCur - rPrev) >= 1
                ? <span className={`text-xs font-medium num ${rCur > rPrev ? "c-green" : "c-red"}`}>{rCur > rPrev ? "▲" : "▼"} {Math.abs(rCur - rPrev).toFixed(0)} punti</span>
                : null],
          ].map(([label, value, sub, delta]) => (
            <div key={label} className="flex items-center justify-between py-3 gap-3">
              <div className="min-w-0"><div className="text-[15px]">{label}</div><div className="text-xs muted num">{sub}</div></div>
              <div className="text-right shrink-0"><div className="num text-[15px] font-semibold">{value}</div>{delta}</div>
            </div>
          ))}
        </Rows>
      </Section>

      <Section title="Ritmo di spesa">
        <div className="panel pt-4 pr-2 pb-1">
          {!RC ? noCharts : (
            <RC.ResponsiveContainer width="100%" height={190}>
              <RC.LineChart data={pace.rows} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
                <RC.CartesianGrid stroke={theme.line} vertical={false} />
                <RC.XAxis dataKey="day" tick={tickStyle} axisLine={false} tickLine={false} interval={4} />
                <RC.YAxis tick={tickStyle} axisLine={false} tickLine={false} width={40} tickFormatter={compactEUR} />
                <RC.Tooltip content={<ChartTip labelPrefix="Giorno " />} />
                <RC.Line type="monotone" dataKey="prev" name={cap(monthName(anPrevKey))} stroke={theme.muted} strokeDasharray="4 4" strokeWidth={1.5} dot={false} connectNulls={false} />
                <RC.Line type="monotone" dataKey="cur" name={cap(monthName(anMonth))} stroke={theme.red} strokeWidth={2.2} dot={false} connectNulls={false} />
              </RC.LineChart>
            </RC.ResponsiveContainer>
          )}
        </div>
        <p className="text-sm muted mt-2 num">
          {anMonth === curKey
            ? `Al giorno ${pace.curLen} hai speso ${fmtEUR(pace.atDayCur)}; a ${monthName(anPrevKey)}, nello stesso punto, ${fmtEUR(pace.atDayPrev)}.`
            : `A ${monthName(anMonth)} hai speso ${fmtEUR(anAgg.exp)}, contro ${fmtEUR(anPrev.exp)} a ${monthName(anPrevKey)}.`}
        </p>
      </Section>

      <Section title="Dove vanno i soldi">
        {donut.length ? (
          <>
            {RC && (
              <div className="relative" style={{ height: 190 }}>
                <RC.ResponsiveContainer width="100%" height={190}>
                  <RC.PieChart>
                    <RC.Pie data={donut} dataKey="cur" nameKey="label" innerRadius={58} outerRadius={84} paddingAngle={1.5} stroke="none"
                      onClick={(_, i) => setSelCat(selCat === donut[i].id ? null : donut[i].id)}>
                      {donut.map((d) => <RC.Cell key={d.id} fill={d.color} fillOpacity={!selCat || selCat === d.id ? 1 : 0.28} />)}
                    </RC.Pie>
                  </RC.PieChart>
                </RC.ResponsiveContainer>
                <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                  <span className="text-xs muted">{selRow ? selRow.label : "Totale uscite"}</span>
                  <span className="num text-lg font-semibold">{fmtEUR(selRow ? selRow.cur : anAgg.exp)}</span>
                </div>
              </div>
            )}
            <Rows>
              {catRows.map((r) => (
                <button key={r.id} onClick={() => setSelCat(selCat === r.id ? null : r.id)} className="flex items-center gap-3 text-left"
                  style={{ background: selCat === r.id ? "var(--surface2)" : "transparent", margin: "0 -16px", padding: "12px 16px", width: "calc(100% + 32px)" }}>
                  <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: r.color }} />
                  <span className="flex-1 min-w-0">
                    <span className="block text-[15px] truncate">{r.label}</span>
                    <span className="block text-xs muted num">{anAgg.exp > 0 ? `${((r.cur / anAgg.exp) * 100).toFixed(0)}% delle uscite` : ""}{r.prev > 0 ? `${anAgg.exp > 0 ? ", " : ""}prima ${fmtEUR(r.prev)}` : ""}</span>
                  </span>
                  <span className="text-right shrink-0">
                    <span className="block num text-[15px] font-medium">{fmtEUR(r.cur)}</span>
                    <Delta cur={r.cur} prev={r.prev} upIsGood={false} />
                  </span>
                </button>
              ))}
            </Rows>
            {selRow && (
              <div className="panel mt-3 pt-4 pr-2 pb-2">
                <div className="px-4 mb-2">
                  <div className="text-[15px] font-semibold">{selRow.label} negli ultimi {anPeriod} mesi</div>
                  <div className="text-xs muted num">Media {fmtEUR(catAvg)} al mese</div>
                </div>
                {RC && (
                  <RC.ResponsiveContainer width="100%" height={160}>
                    <RC.BarChart data={catSeries} margin={{ top: 4, right: 6, left: 0, bottom: 0 }}>
                      <RC.CartesianGrid stroke={theme.line} vertical={false} />
                      <RC.XAxis dataKey="label" tick={tickStyle} axisLine={false} tickLine={false} />
                      <RC.YAxis tick={tickStyle} axisLine={false} tickLine={false} width={40} tickFormatter={compactEUR} />
                      <RC.Tooltip content={<ChartTip />} cursor={{ fill: theme.line, opacity: 0.35 }} />
                      <RC.ReferenceLine y={catAvg} stroke={theme.muted} strokeDasharray="4 4" />
                      <RC.Bar dataKey="value" name={selRow.label} fill={selRow.color} radius={[4, 4, 0, 0]}>
                        {catSeries.map((s) => <RC.Cell key={s.key} fill={selRow.color} fillOpacity={s.key === anMonth ? 1 : 0.5} />)}
                      </RC.Bar>
                    </RC.BarChart>
                  </RC.ResponsiveContainer>
                )}
              </div>
            )}
            {!selRow && <p className="text-xs muted mt-2">Tocca una categoria per vederne l'andamento nel tempo.</p>}
          </>
        ) : (
          <p className="text-sm muted">Nessuna uscita registrata a {monthName(anMonth)}.</p>
        )}
      </Section>

      <Section title="Budget mensili" action={<span className="text-xs muted">{cap(monthLabel(curKey))}</span>}>
        <Rows>
          {[...budgetRows].sort((a, b) => (b.limit > 0) - (a.limit > 0) || b.spent - a.spent).map((r) => (
            <BudgetRow key={r.id} r={r} onClick={() => setBudgetModal({ cat: r })} />
          ))}
        </Rows>
      </Section>
    </div>
  );

  /* ---------- Conti ---------- */
  const positiveTotal = accounts.reduce((s, a) => s + Math.max(0, a.balance), 0);
  const renderAccounts = () => (
    <div>
      <h1 className="serif text-[32px] leading-tight">Conti</h1>
      <div className="mt-3">
        <div className="text-sm muted">Totale</div>
        <div className={`serif num text-[40px] leading-tight ${totalAccounts < 0 ? "c-red" : ""}`}>{fmtEUR(totalAccounts)}</div>
      </div>
      {positiveTotal > 0 && accounts.length > 1 && (
        <div className="flex mt-3 rounded-full overflow-hidden" style={{ height: 8, background: "var(--surface2)" }}>
          {accounts.map((a, i) => a.balance > 0 && (
            <div key={a.id} style={{ width: `${(a.balance / positiveTotal) * 100}%`, background: ACCOUNT_COLORS[i % ACCOUNT_COLORS.length] }} />
          ))}
        </div>
      )}
      <div className="mt-5">
        {accounts.length ? (
          <Rows>
            {accounts.map((a, i) => (
              <button key={a.id} onClick={() => setAccModal({ acc: a })} className="w-full flex items-center gap-3 py-3.5 text-left">
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: ACCOUNT_COLORS[i % ACCOUNT_COLORS.length] }} />
                <span className="flex-1 min-w-0">
                  <span className="block text-[15px] truncate">{a.name}</span>
                  {positiveTotal > 0 && a.balance > 0 && <span className="block text-xs muted num">{((a.balance / positiveTotal) * 100).toFixed(0)}% del totale</span>}
                </span>
                <span className={`num text-[15px] font-semibold ${a.balance < 0 ? "c-red" : ""}`}>{fmtEUR(a.balance)}</span>
              </button>
            ))}
          </Rows>
        ) : (
          <p className="text-[15px] muted">Nessun conto. Aggiungine uno con il saldo di oggi per far partire i calcoli.</p>
        )}
      </div>
      <div className="grid grid-cols-2 gap-2 mt-3">
        <button onClick={() => setAccModal({ acc: null })} className="btn btn-ghost">Nuovo conto</button>
        <button onClick={() => setTrModal({ tx: null })} className="btn btn-ghost">Giroconto</button>
      </div>

      <Section title="Pagamenti con Wallet">
        <div className="panel p-4">
          <p className="text-sm muted">
            {data.walletLastImport ? `Ultima importazione ${relativeDay(data.walletLastImport, todayISO)}. ` : "Nessuna importazione finora. "}
            {Object.keys(data.cardMap).length > 0 && `Carte abbinate a un conto: ${Object.keys(data.cardMap).length}. `}
            {Object.keys(data.merchantMap).length > 0 && `Esercenti riconosciuti: ${Object.keys(data.merchantMap).length}.`}
          </p>
          <button onClick={() => setWalletGuide(true)} className="btn btn-ghost mt-3">Guida alla configurazione</button>
        </div>
      </Section>

      <Section title="Backup">
        <BackupSection data={data} onImport={(d) => { setData(d); setNote("Backup ripristinato"); }} />
      </Section>

      <Section title="Dati">
        <div className="panel p-4">
          <p className="text-sm muted">Cancella conti, movimenti, scadenze e budget da questo telefono. L'operazione non si può annullare.</p>
          <DeleteButton label="Cancella tutti i dati" onConfirm={() => { setData({ ...EMPTY_DATA }); setNote("Dati cancellati"); }} />
        </div>
      </Section>
    </div>
  );

  const views = { overview: renderOverview, movements: renderMovements, schedule: renderSchedule, analysis: renderAnalysis, accounts: renderAccounts };

  return (
    <div style={{ minHeight: "100vh" }}>
      <main className="max-w-xl mx-auto px-4" style={{ paddingTop: "calc(env(safe-area-inset-top) + 18px)", paddingBottom: "calc(env(safe-area-inset-bottom) + 150px)" }}>
        {views[tab]()}
      </main>

      <input ref={walletRef} type="file" accept=".txt,text/plain" style={{ display: "none" }} onChange={onWalletFile} />

      {note && (
        <div className="fixed left-4 right-4 z-50 flex justify-center fade" style={{ top: "calc(env(safe-area-inset-top) + 10px)" }}>
          <div className="flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-medium" style={{ background: "var(--ink)", color: "var(--paper)", boxShadow: "0 6px 20px rgba(0,0,0,.18)" }}>
            <Check size={16} /> {note}
          </div>
        </div>
      )}

      <button onClick={() => setAddSheet(true)} aria-label="Aggiungi"
        className="fixed z-30 flex items-center justify-center active:scale-95"
        style={{ right: 18, bottom: "calc(env(safe-area-inset-bottom) + 76px)", width: 56, height: 56, borderRadius: 999, background: "var(--ink)", color: "var(--paper)", boxShadow: "0 8px 22px rgba(0,0,0,.22)" }}>
        <Plus size={26} />
      </button>

      <nav className="fixed bottom-0 left-0 right-0 z-30" style={{ background: "var(--surface)", borderTop: "1px solid var(--line)", paddingBottom: "env(safe-area-inset-bottom)" }}>
        <div className="max-w-xl mx-auto flex">
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex-1 flex flex-col items-center gap-1 pt-2 pb-1.5"
              style={{ color: tab === t.id ? "var(--ink)" : "var(--muted)" }} aria-current={tab === t.id ? "page" : undefined}>
              <t.Icon size={21} />
              <span className="text-[11px]" style={{ fontWeight: tab === t.id ? 700 : 500 }}>{t.label}</span>
            </button>
          ))}
        </div>
      </nav>

      {addSheet && <AddSheet onClose={() => setAddSheet(false)} onPick={pickAdd} />}
      {walletReview && (
        <WalletReviewSheet items={walletReview} accounts={accounts}
          onClose={() => setWalletReview(null)} onConfirm={confirmWallet} onIgnore={ignoreWallet} />
      )}
      {walletGuide && <WalletGuideSheet onClose={() => setWalletGuide(false)} />}
      {txModal && (
        <TxFormModal tx={txModal.tx} initialType={txModal.type} accounts={accounts} todayISO={todayISO}
          onClose={() => setTxModal(null)} onSave={saveTx} onDelete={deleteTx} />
      )}
      {trModal && (
        <TransferModal tx={trModal.tx} accounts={accounts} todayISO={todayISO}
          onClose={() => setTrModal(null)} onSave={saveTx} onDelete={deleteTx}
          onAddAccount={() => { setTrModal(null); setAccModal({ acc: null }); }} />
      )}
      {recModal && (
        <RecurringFormModal item={recModal.item} accounts={accounts} initialKind={recModal.kind || "expense"} todayISO={todayISO}
          onClose={() => setRecModal(null)} onSave={saveRecurring} onDelete={deleteRecurring} />
      )}
      {accModal && (
        <AccountFormModal account={accModal.acc} onClose={() => setAccModal(null)} onSave={saveAccount} onDelete={deleteAccount} />
      )}
      {budgetModal && (
        <BudgetModal cat={budgetModal.cat} limit={budgets[budgetModal.cat.id] || 0} spent={curAgg.cat[budgetModal.cat.id] || 0}
          onClose={() => setBudgetModal(null)}
          onSave={(v) => setBudget(budgetModal.cat.id, v)}
          onRemove={() => setBudget(budgetModal.cat.id, 0)} />
      )}
    </div>
  );
}

window.__appStarted = true;
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
