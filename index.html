  body { font-family: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  .serif { font-family: "Young Serif", Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }

  .muted { color: var(--muted); }
  .c-green { color: var(--green); } .c-red { color: var(--red); } .c-ochre { color: var(--ochre); } .c-blue { color: var(--blue); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .inp { width: 100%; box-sizing: border-box; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; color: var(--ink); font: inherit; font-size: 16px; min-height: 46px; -webkit-appearance: none; appearance: none; }

  .chip-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn { display: block; width: 100%; border-radius: 12px; padding: 13px 16px; font-weight: 600; font-size: 15px; text-align: center; }
  .btn-ink { background: var(--ink); color: var(--paper); }
  .btn-ink:disabled { opacity: .3; }

<script>
  window.__appStarted = false;
  window.__bootFail = function (msg) {
    if (window.__appStarted) return;
    var b = document.getElementById("boot");
    if (!b) return;
    b.innerHTML =
      "Impossibile avviare l'app.<br>Controlla la connessione e riprova." +
      '<div class="err">' + String(msg || "").replace(/</g, "&lt;") + "</div>" +
      '<button onclick="location.reload()">Riprova</button>';
  };
  window.addEventListener("error", function (e) {
    var t = e && e.target;
    if (t && t.tagName === "SCRIPT" && t.src) {
      if (t.getAttribute("data-optional") !== "1") window.__bootFail("Libreria non caricata: " + t.src);
      return;
    }
    if (e && e.message) window.__bootFail(e.message);
  }, true);
  setTimeout(function () { if (!window.__appStarted) window.__bootFail("Tempo di caricamento scaduto"); }, 25000);
  (function () {
    try {
      var c = document.createElement("canvas");
      c.width = 180; c.height = 180;
      var x = c.getContext("2d");
      x.fillStyle = "#1E4637";
      x.fillRect(0, 0, 180, 180);
      x.strokeStyle = "#3F7A5E";
      x.lineWidth = 1.2;
      for (var i = 0; i < 12; i++) {
        x.beginPath();
        for (var px = 0; px <= 180; px += 3) {
          var py = 12 + i * 15 + 5 * Math.sin(px / 14 + i * 0.6);
          if (px === 0) x.moveTo(px, py); else x.lineTo(px, py);
        }
        x.stroke();
      }
      x.fillStyle = "#EEF4EC";
      x.font = "bold 100px Georgia, serif";
      x.textAlign = "center";
      x.textBaseline = "middle";
      x.fillText("€", 90, 96);
      var url = c.toDataURL("image/png");
      ["apple-touch-icon", "icon"].forEach(function (rel) {
        var l = document.createElement("link");
        l.rel = rel; l.href = url;
        document.head.appendChild(l);
      });
    } catch (e) {}
  })();
</script>

const localISODate = (d = new Date()) =>

const maxISO = (a, b) => (a > b ? a : b);
const minISO = (a, b) => (a < b ? a : b);
const monthKeyOf = (s) => s.slice(0, 7);
const keyToDate = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, 1); };
const shiftMonth = (key, delta) => { const d = keyToDate(key); d.setMonth(d.getMonth() + delta); return localISODate(d).slice(0, 7); };
const daysInMonth = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m, 0).getDate(); };

const monthEndISO = (key) => `${key}-${String(daysInMonth(key)).padStart(2, "0")}`;

const intl = (opts) => new Intl.DateTimeFormat("it-IT", opts);

const monthName = (key) => intl({ month: "long" }).format(keyToDate(key));
const shortMonth = (key) => intl({ month: "short" }).format(keyToDate(key)).replace(".", "");

const fmtDayLong = (iso) => intl({ weekday: "long", day: "numeric", month: "long" }).format(isoToDate(iso));
const fmtDayShortW = (iso) => intl({ weekday: "short", day: "numeric", month: "short" }).format(isoToDate(iso));
const weekdayShort = (iso) => intl({ weekday: "short" }).format(isoToDate(iso)).replace(".", "");
const parseAmount = (s) => parseFloat(String(s).replace(/\s/g, "").replace(",", "."));
const uid = (p) => `${p}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
const daysUntil = (date, todayISO) => Math.round((date - isoToDate(todayISO)) / 86400000);
const sameTag = (a, b) => a.toLowerCase() === b.toLowerCase();
const isInvest = (a) => !!a && a.type === "invest";
const catMeta = (type, id) => {
  const list = type === "income" ? INCOME_CATEGORIES : EXPENSE_CATEGORIES;
  return list.find((c) => c.id === id) || list[list.length - 1];
};
const dueText = (days) =>
  days < 0 ? `Scaduto da ${-days} ${days === -1 ? "giorno" : "giorni"}` : days === 0 ? "Oggi" : days === 1 ? "Domani" : `Tra ${days} giorni`;
const relativeDay = (isoTs, todayISO) => {
  if (!isoTs) return null;
  const d = localISODate(new Date(isoTs));
  const diff = daysUntil(isoToDate(d), todayISO);
  if (diff === 0) return "oggi";
  if (diff === -1) return "ieri";
  if (diff > -7) return `${-diff} giorni fa`;
  return `il ${fmtDateShort(d)}`;
};
const freqHelpText = (frequency, refDate) => {
  if (!refDate) return "";
  const d = isoToDate(refDate);
  if (frequency === "settimanale") return `Si ripete ogni ${intl({ weekday: "long" }).format(d)}`;
  if (frequency === "mensile") return `Si ripete ogni mese il giorno ${d.getDate()}`;
  return `Si ripete ogni anno il ${intl({ day: "numeric", month: "long" }).format(d)}`;
};
const monthlyEquivalent = (item) => {
  if (item.frequency === "mensile") return item.amount;
  if (item.frequency === "annuale") return item.amount / 12;
  return (item.amount * 52) / 12;
};
const goalMonthly = (g, todayISO) => {
  if (!g.deadline) return null;
  const days = daysUntil(isoToDate(g.deadline), todayISO);
  if (days < 0) return null;
  const months = Math.max(1, Math.ceil(days / 30.44));
  return round2(Math.max(0, g.target - g.saved) / months);
};
const lastValuation = (a) => {
  const v = (a.valuations || []).slice().sort((x, y) => x.date.localeCompare(y.date));
  return v.length ? v[v.length - 1] : null;
};
const accountValue = (a) => {
  if (!isInvest(a)) return a.balance;
  const v = lastValuation(a);
  return v ? round2(v.value + (a.balance - v.book)) : a.balance;
};
function futureValue(start, monthly, annualRatePct, months) {
  const r = Math.pow(1 + annualRatePct / 100, 1 / 12) - 1;
  if (Math.abs(r) < 1e-9) return start + monthly * months;
  const g = Math.pow(1 + r, months);
  return start * g + monthly * ((g - 1) / r);
}

/* ================= Importazione Wallet / Siri ================= */
function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36) + s.length.toString(36);
}
function parseWalletAmount(raw) {
  if (raw == null) return 0;
  let s = String(raw).replace(/[^\d,.]/g, "");
  if (!s) return 0;
  const lc = s.lastIndexOf(","), ld = s.lastIndexOf(".");
  if (lc > -1 && ld > -1) {
    const dec = lc > ld ? "," : ".";
    const th = dec === "," ? "." : ",";
    s = s.split(th).join("").replace(dec, ".");
  } else if (lc > -1) {
    s = s.replace(",", ".");
  } else if (ld > -1) {
    const parts = s.split(".");
    if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3)) s = parts.join("");
  }
  const n = parseFloat(s);
  return isFinite(n) ? round2(Math.abs(n)) : 0;
}
function parseWalletDate(raw, todayISO) {
  const m = String(raw || "").match(/(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2})[:.](\d{2}))?/);
  if (m) return { date: `${m[1]}-${m[2]}-${m[3]}`, time: m[4] ? `${m[4].padStart(2, "0")}:${m[5]}` : "" };
  const t = Date.parse(raw);
  if (!isNaN(t)) {
    const d = new Date(t);
    return { date: localISODate(d), time: `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` };
  }
  return { date: todayISO, time: "" };
}
function parseWalletFile(text, seen, todayISO) {
  const items = [];
  const batch = new Set();
  let valid = 0;
  String(text).split(/\r?\n/).forEach((rawLine) => {
    const line = rawLine.trim();
    if (!line || line.startsWith("#")) return;
    const parts = line.split("|").map((p) => p.trim());
    if (parts.length < 3) return;
    valid++;
    const hash = hashStr(line);
    if (seen.has(hash) || batch.has(hash)) return;
    batch.add(hash);
    const { date, time } = parseWalletDate(parts[0], todayISO);
    items.push({ hash, date: date > todayISO ? todayISO : date, time, merchant: parts[1] || "", amount: parseWalletAmount(parts[2]), card: parts[3] || "" });
  });
  items.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  return { items, valid };
}

/* ================= Ricorrenze ================= */
function nextRenewal(item, from) {
  const ref = isoToDate(item.refDate);
  const start = new Date(from);
  start.setHours(0, 0, 0, 0);
  if (item.frequency === "settimanale") {
    const cand = new Date(start);
    cand.setDate(cand.getDate() + ((ref.getDay() - start.getDay() + 7) % 7));
    return cand;
  }
  const day = ref.getDate();
  if (item.frequency === "mensile") {
    let y = start.getFullYear(), m = start.getMonth();
    let cand = new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
    if (cand < start) {
      m += 1;
      if (m > 11) { m = 0; y += 1; }
      cand = new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
    }
    return cand;
  }
  const month = ref.getMonth();
  let y = start.getFullYear();
  let cand = new Date(y, month, Math.min(day, new Date(y, month + 1, 0).getDate()));
  if (cand < start) {
    y += 1;
    cand = new Date(y, month, Math.min(day, new Date(y, month + 1, 0).getDate()));
  }
  return cand;
}
function occurrenceAfter(item, date) {
  const next = new Date(date);
  next.setDate(next.getDate() + 1);
  return nextRenewal(item, next);
}
function occurrencesInRange(item, fromISO, toISO) {
  const out = [];
  if (fromISO > toISO) return out;
  const end = isoToDate(toISO);
  let d = nextRenewal(item, isoToDate(fromISO));
  let guard = 0;
  while (d <= end && guard < 400) { out.push(localISODate(d)); d = occurrenceAfter(item, d); guard++; }
  return out;
}
function nextDue(item, todayISO) {
  let startISO = todayISO;
  if (item.processedThrough) {
    const afterPaid = addDaysISO(item.processedThrough, 1);
    startISO = item.auto ? maxISO(afterPaid, todayISO) : afterPaid;
  }
  return nextRenewal(item, isoToDate(startISO));
}
function recurringTx(item, date) {
  if (item.kind === "transfer") {
    return { id: uid("t"), type: "transfer", amount: item.amount, accountId: item.accountId, toAccountId: item.toAccountId, description: item.name, date, category: null, tags: [], recurringId: item.id };
  }
  const isIncome = item.kind === "income";
  return { id: uid("t"), type: item.kind, amount: item.amount, category: isIncome ? item.category : "abbonamenti", description: item.name, date, accountId: item.accountId || null, tags: [], recurringId: item.id };
}

/* ================= Saldi ================= */
function applyBalance(accounts, accountId, delta) {
  if (!accountId || !delta) return accounts;
  return accounts.map((a) => (a.id === accountId ? { ...a, balance: round2(a.balance + delta) } : a));
}
function txEffects(t) {
  if (t.type === "transfer") return [[t.accountId, -t.amount], [t.toAccountId, t.amount]];
  return [[t.accountId, t.type === "income" ? t.amount : -t.amount]];
}
function applyEffects(accounts, effects, sign) {
  return effects.reduce((acc, [id, delta]) => applyBalance(acc, id, sign * delta), accounts);
}

/* ================= Spese condivise ================= */
const sharedShare = (e) => e.total / Math.max(1, (e.participants?.length || 0) + (e.includeMe ? 1 : 0));
const myShareOf = (e) => (e.includeMe ? round2(sharedShare(e)) : 0);
function sharedExtraEffects(e) {
  if (e.kind === "settle") return [[e.accountId, e.direction === "in" ? e.amount : -e.amount]];
  if (e.payer === "me") return [[e.accountId, -round2(e.total - myShareOf(e))]];
  return [];
}
function entryEffectFor(e, personId) {
  if (e.kind === "settle") return e.personId === personId ? (e.direction === "in" ? -e.amount : e.amount) : 0;
  const s = sharedShare(e);
  if (e.payer === "me") return e.participants.includes(personId) ? s : 0;
  if (e.payer === personId && e.includeMe) return -s;
  return 0;
}

/* ================= Ricorrenti automatici ================= */
function applyCatchUp(data, todayISO) {
  let count = 0;
  let transactions = data.transactions;
  let accounts = data.accounts;
  const end = isoToDate(todayISO);
  const recurring = data.recurring.map((item) => {
    if (!item.active || !item.auto) return item;
    const startISO = item.processedThrough ? addDaysISO(item.processedThrough, 1) : todayISO;
    let occ = nextRenewal(item, isoToDate(startISO));
    let processed = false;
    let guard = 0;
    while (occ <= end && guard < 520) {
      const tx = recurringTx(item, localISODate(occ));
      transactions = [...transactions, tx];
      accounts = applyEffects(accounts, txEffects(tx), 1);
      count++;
      processed = true;
      occ = occurrenceAfter(item, occ);
      guard++;
    }
    return processed ? { ...item, processedThrough: todayISO } : item;
  });
  return { data: { ...data, transactions, recurring, accounts }, count };
}

const EMPTY_DATA = {
  transactions: [], recurring: [], accounts: [], budgets: {},
  walletSeen: [], merchantMap: {}, cardMap: {}, walletLastImport: null,
  goals: [], people: [], shared: [], investSettings: { rate: 5, years: 10 },
};
const isObj = (o) => o && typeof o === "object" && !Array.isArray(o);
const arr = (v) => (Array.isArray(v) ? v : []);
function normalize(p) {
  return {
    transactions: arr(p.transactions),
    recurring: arr(p.recurring),
    accounts: arr(p.accounts),
    budgets: isObj(p.budgets) ? p.budgets : {},
    walletSeen: arr(p.walletSeen),
    merchantMap: isObj(p.merchantMap) ? p.merchantMap : {},
    cardMap: isObj(p.cardMap) ? p.cardMap : {},
    walletLastImport: typeof p.walletLastImport === "string" ? p.walletLastImport : null,
    goals: arr(p.goals),
    people: arr(p.people),
    shared: arr(p.shared),
    investSettings: isObj(p.investSettings) ? { rate: 5, years: 10, ...p.investSettings } : { rate: 5, years: 10 },
  };
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) {}
  return { ...EMPTY_DATA };
}

/* ================= Tema per i grafici ================= */
function readTheme() {
  const s = getComputedStyle(document.documentElement);
  const g = (n) => s.getPropertyValue(n).trim();
  return { ink: g("--ink"), muted: g("--muted"), line: g("--line"), green: g("--green"), red: g("--red"), ochre: g("--ochre"), blue: g("--blue"), surface: g("--surface"), surface2: g("--surface2") };
}
function useTheme() {
  const [t, setT] = useState(readTheme);
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const h = () => setT(readTheme());
    if (mq.addEventListener) mq.addEventListener("change", h); else mq.addListener(h);
    return () => { if (mq.removeEventListener) mq.removeEventListener("change", h); else mq.removeListener(h); };
  }, []);
  return t;
}

      style={{ position: "relative", width: 44, height: 26, borderRadius: 999, flexShrink: 0, background: checked ? "var(--green)" : "var(--line)", transition: "background .15s" }}>
      <span style={{ position: "absolute", top: 3, left: 3, width: 20, height: 20, borderRadius: 999, background: "#fff", transform: checked ? "translateX(18px)" : "none", transition: "transform .15s" }} />
    </button>
  );
}

function Delta({ cur, prev, upIsGood }) {
  if (!prev && !cur) return null;
  if (!prev) return <span className="text-xs muted">nessun confronto</span>;
  const p = ((cur - prev) / Math.abs(prev)) * 100;
  if (Math.abs(p) < 1) return <span className="text-xs muted">stabile</span>;
  const up = p > 0;
  const good = upIsGood ? up : !up;
  return <span className={`text-xs font-medium num ${good ? "c-green" : "c-red"}`}>{up ? "▲" : "▼"} {Math.abs(p).toFixed(0)}%</span>;
}

function DiffAmount({ cur, prev, upIsGood }) {
  const diff = cur - prev;
  if (Math.abs(diff) < 0.5) return <span className="text-xs muted">stabile</span>;
  const good = upIsGood ? diff > 0 : diff < 0;
  return <span className={`text-xs font-medium num ${good ? "c-green" : "c-red"}`}>{diff > 0 ? "▲" : "▼"} {fmtEUR(Math.abs(diff))}</span>;
}

function Ring({ value, size = 64, stroke = 7, color, track = "var(--surface2)", children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const [v, setV] = useState(0);
  useEffect(() => { const id = requestAnimationFrame(() => setV(Math.max(0, Math.min(1, value)))); return () => cancelAnimationFrame(id); }, [value]);
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }} aria-hidden="true">
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={track} strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={c * (1 - v)} className="ring-anim" />
      </svg>
      <div className="absolute inset-0 flex items-center justify-center text-center">{children}</div>
    </div>
  );
}

function Sparkline({ values, color, height = 44 }) {
  if (!values || values.length < 2) return null;
  const w = 300;
  const min = Math.min(...values), max = Math.max(...values);
  const span = max - min || 1;
  const pts = values.map((v, i) => [(i / (values.length - 1)) * w, height - 4 - ((v - min) / span) * (height - 8)]);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
  const area = `${line} L${w} ${height} L0 ${height} Z`;
  const last = pts[pts.length - 1];
  return (
    <svg viewBox={`0 0 ${w} ${height}`} preserveAspectRatio="none" className="w-full" style={{ height }} aria-hidden="true">
      <path d={area} style={{ fill: color, opacity: 0.16 }} />
      <path d={line} fill="none" strokeWidth="1.8" vectorEffect="non-scaling-stroke" style={{ stroke: color }} />
      <circle cx={last[0]} cy={last[1]} r="3" style={{ fill: color }} />
    </svg>
  );
}

    <div>
      {tags.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mb-2">
          {tags.map((t) => (
            <button key={t} onClick={() => onChange(tags.filter((x) => x !== t))} className="chip chip-on flex items-center gap-1" aria-label={`Rimuovi ${t}`}>{t} <X size={12} /></button>
          ))}

        <input className="inp" value={v} onChange={(e) => setV(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" || e.key === ",") { e.preventDefault(); add(v); } }}

        <button onClick={() => add(v)} disabled={!v.trim()} className="btn btn-ghost" style={{ width: "auto", padding: "0 16px" }}>Aggiungi</button>
      </div>
      {sugg.length > 0 && (
        <div className="flex flex-wrap gap-1.5 mt-2">
          {sugg.map((s) => <button key={s} onClick={() => add(s)} className="chip">{s}</button>)}
        </div>
      )}
    </div>
  );
}

/* ================= Biglietti incisi e pulsante Wallet ================= */
function Guilloche({ color = "var(--note-line)" }) {
  const paths = useMemo(() => {
    const out = [];
    for (let i = 0; i < 16; i++) {
      let d = "";
      for (let x = 0; x <= 400; x += 5) {
        const y = 24 + i * 11 + 6 * Math.sin(x / 23 + i * 0.6) + 3.5 * Math.sin(x / 9.5 - i * 0.35);
        d += (x === 0 ? "M" : "L") + x + " " + y.toFixed(1);
      }
      out.push(d);
    }
    for (let k = 0; k < 7; k++) {
      let d = "";
      for (let t = 0; t <= 360; t += 2) {
        const th = (t * Math.PI) / 180;
        const r = 46 + 10 * Math.sin(14 * th + k * 0.45) + k * 1.2;
        d += (t === 0 ? "M" : "L") + (330 + r * Math.cos(th)).toFixed(1) + " " + (64 + r * Math.sin(th)).toFixed(1);
      }
      out.push(d + "Z");
    }
    return out;
  }, []);
  return (
    <svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice" className="absolute inset-0 w-full h-full" aria-hidden="true">

function WalletReviewSheet({ items, accounts, onClose, onConfirm, onIgnore }) {
  const [rows, setRows] = useState(() => items.map((it) => ({ ...it, include: true, amountStr: it.amount > 0 ? String(it.amount).replace(".", ",") : "" })));
  const upd = (i, patch) => setRows((rs) => rs.map((r, j) => (j === i ? { ...r, ...patch } : r)));
  const parsedRows = rows.map((r) => ({ ...r, amount: round2(parseAmount(r.amountStr) || 0) }));
  const included = parsedRows.filter((r) => r.include);
  const invalid = included.some((r) => !(r.amount > 0));
  const total = included.reduce((s, r) => s + (r.amount > 0 ? r.amount : 0), 0);
  const n = included.length;
  return (
    <Sheet title={items.length === 1 ? "1 nuovo pagamento" : `${items.length} nuovi pagamenti`} onClose={onClose}>

      </div>

          </div>

function goalMeta(g, todayISO) {
  const done = g.saved >= g.target;
  const need = goalMonthly(g, todayISO);
  const late = g.deadline && daysUntil(isoToDate(g.deadline), todayISO) < 0 && !done;
  if (done) return { text: "Obiettivo raggiunto", cls: "c-green" };
  if (late) return { text: `Scadenza superata, mancano ${fmtEUR(g.target - g.saved)}`, cls: "c-red" };
  if (need != null) return { text: `${fmtEUR(need)} al mese fino al ${fmtDateShort(g.deadline)}`, cls: "muted" };
  return { text: `Mancano ${fmtEUR(g.target - g.saved)}`, cls: "muted" };
}

function GoalCard({ g, todayISO, onOpen }) {
  const ratio = g.target > 0 ? g.saved / g.target : 0;
  const m = goalMeta(g, todayISO);
  return (
    <button onClick={onOpen} className="panel p-4 text-left flex flex-col items-start gap-3 w-full">
      <Ring value={ratio} size={76} stroke={8} color={g.color}>
        <span className="num text-[15px] font-semibold">{Math.round(Math.min(1, ratio) * 100)}%</span>
      </Ring>
      <span className="w-full min-w-0">
        <span className="block text-[15px] font-semibold truncate">{g.name}</span>
        <span className="block num text-sm mt-0.5">{fmtEUR0(g.saved)} <span className="muted">di {fmtEUR0(g.target)}</span></span>
        <span className={`block text-xs mt-1 ${m.cls}`}>{m.text}</span>
      </span>
    </button>
  );
}

function GoalDetailSheet({ goal, todayISO, theme, onClose, onMove, onEdit }) {
  const [dir, setDir] = useState("add");
  const [amount, setAmount] = useState("");
  const a = parseAmount(amount);
  const validMove = a > 0 && (dir === "add" || a <= goal.saved + 0.004);
  const ratio = goal.target > 0 ? goal.saved / goal.target : 0;
  const m = goalMeta(goal, todayISO);
  const chart = useMemo(() => {
    const hist = (goal.history || []).slice().sort((x, y) => x.date.localeCompare(y.date));
    const created = goal.createdAt || (hist[0] ? hist[0].date : todayISO);
    const startSaved = hist.filter((h) => h.date <= created).reduce((s, h) => s + h.delta, 0);
    const dates = new Set([created, todayISO, ...hist.map((h) => h.date)]);
    if (goal.deadline && goal.deadline > created) dates.add(goal.deadline);
    const list = [...dates].sort();
    const totalDays = goal.deadline ? Math.max(1, -daysUntil(isoToDate(created), goal.deadline)) : null;
    return list.map((d) => {
      const cum = d <= todayISO ? round2(hist.filter((h) => h.date <= d).reduce((s, h) => s + h.delta, 0)) : null;
      let ideal = null;
      if (goal.deadline && totalDays) {
        const p = Math.min(1, Math.max(0, -daysUntil(isoToDate(created), d) / totalDays));
        ideal = round2(startSaved + (goal.target - startSaved) * p);
      }
      return { label: fmtDateShort(d), saved: cum, ideal };
    });
  }, [goal, todayISO]);
  return (
    <Sheet title={goal.name} onClose={onClose}>
      <div className="flex items-center gap-5">
        <Ring value={ratio} size={124} stroke={12} color={goal.color}>
          <span>
            <span className="block serif num text-[26px] leading-none">{Math.round(Math.min(1, ratio) * 100)}%</span>
            <span className="block text-[11px] muted mt-1">completato</span>
          </span>
        </Ring>
        <div className="min-w-0">
          <div className="text-sm muted">Messi da parte</div>
          <div className="num text-[22px] font-semibold">{fmtEUR(goal.saved)}</div>
          <div className="text-sm muted num">di {fmtEUR(goal.target)}</div>
          <div className={`text-xs mt-2 ${m.cls}`}>{m.text}</div>
        </div>
      </div>
      {RC && chart.length > 1 && (
        <div className="panel pt-4 pr-2 pb-1 mt-5">
          <RC.ResponsiveContainer width="100%" height={170}>
            <RC.ComposedChart data={chart} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
              <RC.CartesianGrid stroke={theme.line} vertical={false} />
              <RC.XAxis dataKey="label" tick={{ fill: theme.muted, fontSize: 11 }} axisLine={false} tickLine={false} minTickGap={24} />
              <RC.YAxis tick={{ fill: theme.muted, fontSize: 11 }} axisLine={false} tickLine={false} width={42} tickFormatter={compactEUR} />
              <RC.Tooltip content={<ChartTip />} />
              <RC.ReferenceLine y={goal.target} stroke={goal.color} strokeDasharray="4 4" />
              {goal.deadline && <RC.Line type="linear" dataKey="ideal" name="Percorso ideale" stroke={theme.muted} strokeDasharray="5 4" strokeWidth={1.5} dot={false} connectNulls />}
              <RC.Area type="stepAfter" dataKey="saved" name="Messi da parte" stroke={goal.color} fill={goal.color} fillOpacity={0.18} strokeWidth={2.2} dot={false} connectNulls />
            </RC.ComposedChart>
          </RC.ResponsiveContainer>
        </div>
      )}
      {goal.deadline && <p className="text-xs muted mt-2">La linea tratteggiata mostra dove dovresti essere oggi per arrivare in tempo.</p>}
      <div className="seg mt-5 mb-3">
        <button className={dir === "add" ? "on" : ""} onClick={() => setDir("add")}>Metti da parte</button>
        <button className={dir === "remove" ? "on" : ""} onClick={() => setDir("remove")}>Togli</button>
      </div>
      <div className="flex gap-2">
        <input className="inp num" type="text" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="Importo" />
        <button disabled={!validMove} onClick={() => { if (validMove) { onMove(round2(dir === "add" ? a : -a)); setAmount(""); } }} className="btn btn-ink" style={{ width: "auto", padding: "0 18px" }}>Conferma</button>
      </div>
      {dir === "remove" && a > goal.saved + 0.004 && <p className="text-xs c-red mt-1">Non puoi togliere più di quanto hai messo da parte.</p>}
      <button onClick={onEdit} className="btn btn-ghost mt-4">Modifica obiettivo</button>
    </Sheet>
  );
}

function BackupSection({ data, onImport }) {
  const fileRef = useRef(null);
  const [last, setLast] = useState(() => { try { return localStorage.getItem(BACKUP_KEY); } catch (e) { return null; } });
  const markDone = () => { const now = new Date().toISOString(); try { localStorage.setItem(BACKUP_KEY, now); } catch (e) {} setLast(now); };
  const doExport = async () => {
    const json = JSON.stringify({ app: "flussi-economici", version: 5, exportedAt: new Date().toISOString(), ...data }, null, 2);
    const name = `flussi-backup-${localISODate()}.json`;
    try {
      const file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Backup Flussi Economici" });
        markDone();
        return;
      }
    } catch (e) { if (e && e.name === "AbortError") return; }
    const url = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    markDone();
  };
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      const p = JSON.parse(await f.text());
      if (!Array.isArray(p.transactions) || !Array.isArray(p.recurring) || !Array.isArray(p.accounts)) throw new Error();
      if (window.confirm("Sostituire tutti i dati attuali con quelli del backup?")) onImport(normalize(p));
    } catch (err) { window.alert("Il file scelto non è un backup di Flussi Economici."); }
  };
  const stale = !last || (Date.now() - new Date(last).getTime()) / 86400000 > 30;
  return (
    <div className="panel p-4">
      <p className="text-sm muted mb-3">I dati restano solo su questo telefono. Ultimo backup: <span className={stale ? "c-ochre font-medium" : ""}>{last ? new Date(last).toLocaleDateString("it-IT") : "mai fatto"}</span></p>
      <div className="grid grid-cols-2 gap-2">
        <button onClick={doExport} className="btn btn-ink flex items-center justify-center gap-2"><Download size={16} /> Esporta</button>
        <button onClick={() => fileRef.current && fileRef.current.click()} className="btn btn-ghost flex items-center justify-center gap-2"><Upload size={16} /> Importa</button>
      </div>
      <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={onFile} />
    </div>
  );
}

/* ================= App ================= */
function App() {
  const theme = useTheme();
  const [data, setData] = useState(loadData);
  const [todayISO, setTodayISO] = useState(() => localISODate());
  const [tab, setTab] = useState("overview");
  const [movMonth, setMovMonth] = useState(() => monthKeyOf(localISODate()));
  const [search, setSearch] = useState("");
  const [typeFilter, setTypeFilter] = useState("all");
  const [catFilter, setCatFilter] = useState(null);
  const [tagFilter, setTagFilter] = useState(null);
  const [calMonth, setCalMonth] = useState(() => monthKeyOf(localISODate()));
  const [selDay, setSelDay] = useState(() => localISODate());
  const [recView, setRecView] = useState("expense");
  const [anTab, setAnTab] = useState("trend");
  const [anPeriod, setAnPeriod] = useState(6);
  const [anMonth, setAnMonth] = useState(() => monthKeyOf(localISODate()));
  const [selCat, setSelCat] = useState(null);
  const [forecastDays, setForecastDays] = useState(60);
  const [heatDay, setHeatDay] = useState(null);
  const [merchSort, setMerchSort] = useState("total");
  const [accTab, setAccTab] = useState("accounts");
  const [txModal, setTxModal] = useState(null);
  const [trModal, setTrModal] = useState(null);
  const [recModal, setRecModal] = useState(null);
  const [accModal, setAccModal] = useState(null);
  const [valModal, setValModal] = useState(null);
  const [budgetModal, setBudgetModal] = useState(null);
  const [goalModal, setGoalModal] = useState(null);
  const [goalOpen, setGoalOpen] = useState(null);
  const [sharedModal, setSharedModal] = useState(false);
  const [settleFor, setSettleFor] = useState(null);
  const [personOpen, setPersonOpen] = useState(null);
  const [addSheet, setAddSheet] = useState(false);
  const [walletReview, setWalletReview] = useState(null);
  const [guide, setGuide] = useState(false);
  const [note, setNote] = useState(null);
  const [simMonthly, setSimMonthly] = useState(null);
  const walletRef = useRef(null);

  const { transactions, recurring, accounts, budgets, goals, people, shared, investSettings } = data;
  const curKey = monthKeyOf(todayISO);
  const prevKey = shiftMonth(curKey, -1);
  const dayNum = isoToDate(todayISO).getDate();
  const yesterdayISO = addDaysISO(todayISO, -1);

  useEffect(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {} }, [data]);
  useEffect(() => {
    const onVisible = () => { if (document.visibilityState === "visible") setTodayISO(localISODate()); };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => { document.removeEventListener("visibilitychange", onVisible); window.removeEventListener("focus", onVisible); };
  }, []);
  useEffect(() => {
    const { count } = applyCatchUp(data, todayISO);
    if (count > 0) {
      setData((d) => applyCatchUp(d, todayISO).data);
      setNote(count === 1 ? "Registrato 1 movimento ricorrente" : `Registrati ${count} movimenti ricorrenti`);
    }
  }, [data.recurring, todayISO]);
  useEffect(() => { if (!note) return; const t = setTimeout(() => setNote(null), 5000); return () => clearTimeout(t); }, [note]);
  useEffect(() => { window.scrollTo(0, 0); }, [tab, anTab, accTab]);

  /* ---------- conti, liquidità, investimenti ---------- */
  const accById = useMemo(() => Object.fromEntries(accounts.map((a) => [a.id, a])), [accounts]);
  const cashAccs = accounts.filter((a) => !isInvest(a));
  const investAccs = accounts.filter(isInvest);
  const liquidIds = useMemo(() => new Set(accounts.filter((a) => !isInvest(a)).map((a) => a.id)), [accounts]);
  const investIds = useMemo(() => new Set(accounts.filter(isInvest).map((a) => a.id)), [accounts]);
  const liquidity = round2(cashAccs.reduce((s, a) => s + a.balance, 0));
  const investBook = round2(investAccs.reduce((s, a) => s + a.balance, 0));
  const investValue = round2(investAccs.reduce((s, a) => s + accountValue(a), 0));
  const investGain = round2(investValue - investBook);
  const netWorth = round2(liquidity + investValue);
  const goalsSaved = useMemo(() => round2(goals.reduce((s, g) => s + g.saved, 0)), [goals]);

  const flows = useMemo(() => [
    ...transactions.map((t) => ({ date: t.date, eff: txEffects(t) })),
    ...shared.map((e) => ({ date: e.date, eff: sharedExtraEffects(e) })),
  ], [transactions, shared]);
  const bookAt = (iso, ids) => {
    let cur = 0;
    accounts.forEach((a) => { if (ids.has(a.id)) cur += a.balance; });
    flows.forEach((f) => { if (f.date > iso) f.eff.forEach(([id, d]) => { if (id && ids.has(id)) cur -= d; }); });
    return round2(cur);
  };
  const valueAt = (a, iso) => {
    const vals = (a.valuations || []).filter((v) => v.date <= iso).sort((x, y) => x.date.localeCompare(y.date));
    const book = bookAt(iso, new Set([a.id]));
    const v = vals[vals.length - 1];
    return v ? round2(v.value + (book - v.book)) : book;
  };
  const liqEffect = (item) => {
    const liquidAcc = (id) => !id || !isInvest(accById[id]);
    if (item.kind === "income") return liquidAcc(item.accountId) ? item.amount : 0;
    if (item.kind === "expense") return liquidAcc(item.accountId) ? -item.amount : 0;
    return (item.accountId && liquidAcc(item.accountId) ? -item.amount : 0) + (item.toAccountId && liquidAcc(item.toAccountId) ? item.amount : 0);
  };

  const liqHistory = useMemo(() => {
    const out = [];
    for (let d = 30; d >= 0; d--) out.push(bookAt(addDaysISO(todayISO, -d), liquidIds));
    return out;
  }, [flows, accounts, todayISO, liquidIds]);
  const liq30 = liqHistory.length ? round2(liqHistory[liqHistory.length - 1] - liqHistory[0]) : 0;

  /* ---------- aggregati ---------- */
  const agg = useMemo(() => {
    const m = {};
    for (const t of transactions) {
      if (t.type === "transfer") continue;
      const k = monthKeyOf(t.date);
      const e = m[k] || (m[k] = { inc: 0, exp: 0, cat: {} });
      if (t.type === "income") e.inc += t.amount;
      else { e.exp += t.amount; e.cat[t.category] = (e.cat[t.category] || 0) + t.amount; }
    }
    return m;
  }, [transactions]);
  const getAgg = (k) => agg[k] || { inc: 0, exp: 0, cat: {} };

  const mtd = (type, key, limitDay) =>
    transactions.reduce((s, t) => (t.type === type && monthKeyOf(t.date) === key && isoToDate(t.date).getDate() <= limitDay ? s + t.amount : s), 0);
  const prevLimit = Math.min(dayNum, daysInMonth(prevKey));
  const expMTD = mtd("expense", curKey, dayNum);
  const expPrevMTD = mtd("expense", prevKey, prevLimit);
  const incMTD = mtd("income", curKey, dayNum);
  const incPrevMTD = mtd("income", prevKey, prevLimit);

  const recurringSorted = useMemo(() => recurring
    .map((r) => {
      if (!r.active) return { ...r, daysLeft: null, nextISO: null };
      const due = nextDue(r, todayISO);
      return { ...r, daysLeft: daysUntil(due, todayISO), nextISO: localISODate(due) };
    })
    .sort((a, b) => {
      if (a.active !== b.active) return a.active ? -1 : 1;
      if (a.daysLeft == null || b.daysLeft == null) return 0;
      return a.daysLeft - b.daysLeft;
    }), [recurring, todayISO]);

  const scheduledBetween = (fromISO, toISO) => {
    const out = [];
    recurring.forEach((item) => {
      if (!item.active) return;
      const due = localISODate(nextDue(item, todayISO));
      occurrencesInRange(item, maxISO(due, fromISO), toISO).forEach((date) => out.push({ item, date }));
    });
    return out.sort((a, b) => a.date.localeCompare(b.date));
  };

  const monthSched = useMemo(() => scheduledBetween(monthStartISO(curKey), monthEndISO(curKey)), [recurring, todayISO]);
  const next7 = useMemo(() => scheduledBetween("1970-01-01", addDaysISO(todayISO, 7)), [recurring, todayISO]);
  const projected = round2(liquidity + monthSched.reduce((s, x) => s + liqEffect(x.item), 0));
  const curAgg = getAgg(curKey);
  const savingsCur = curAgg.inc - curAgg.exp;
  const monthCats = EXPENSE_CATEGORIES.map((c) => ({ ...c, v: curAgg.cat[c.id] || 0 })).filter((c) => c.v > 0).sort((a, b) => b.v - a.v);

  const budgetRows = EXPENSE_CATEGORIES.map((c) => ({ ...c, limit: budgets[c.id] || 0, spent: curAgg.cat[c.id] || 0 }));
  const budgetAlerts = budgetRows.filter((r) => r.limit > 0 && r.spent >= r.limit * 0.8);

  const allTags = useMemo(() => {
    const m = {};
    transactions.forEach((t) => (t.tags || []).forEach((tag) => { const k = tag.toLowerCase(); m[k] = m[k] || { name: tag, n: 0 }; m[k].n++; }));
    return Object.values(m).sort((a, b) => b.n - a.n).map((x) => x.name);
  }, [transactions]);

  const peopleBal = useMemo(() => {
    const b = {};
    people.forEach((p) => { b[p.id] = 0; });
    shared.forEach((e) => people.forEach((p) => { b[p.id] += entryEffectFor(e, p.id); }));
    Object.keys(b).forEach((k) => { b[k] = round2(b[k]); });
    return b;
  }, [people, shared]);
  const owedToMe = round2(Object.values(peopleBal).filter((v) => v > 0).reduce((s, v) => s + v, 0));
  const iOwe = round2(-Object.values(peopleBal).filter((v) => v < 0).reduce((s, v) => s + v, 0));

  const pacItems = recurring.filter((r) => r.kind === "transfer" && r.active && isInvest(accById[r.toAccountId]));
  const pacMonthly = round2(pacItems.reduce((s, r) => s + monthlyEquivalent(r), 0));

  /* ---------- osservazioni ---------- */
  const insights = useMemo(() => {
    const out = [];
    const exps = transactions.filter((t) => t.type === "expense");
    if (exps.length) {
      const firstDate = exps.reduce((m, t) => (t.date < m ? t.date : m), exps[0].date);
      const histDays = -daysUntil(isoToDate(firstDate), todayISO);
      if (histDays >= 21) {
        const weeksPrior = Math.max(1, Math.min(8, Math.floor((histDays - 7) / 7)));
        const start7 = addDaysISO(todayISO, -6);
        const priorStart = addDaysISO(todayISO, -6 - 7 * weeksPrior);
        const cur = {}, prior = {};
        exps.forEach((t) => {
          if (t.date >= start7 && t.date <= todayISO) cur[t.category] = (cur[t.category] || 0) + t.amount;
          else if (t.date >= priorStart && t.date < start7) prior[t.category] = (prior[t.category] || 0) + t.amount;
        });
        let up = null, down = null;
        Object.keys({ ...cur, ...prior }).forEach((c) => {
          const a = (prior[c] || 0) / weeksPrior;
          const v = cur[c] || 0;
          if (a < 10) return;
          const r = v / a;
          if (v >= 20 && r >= 1.4 && (!up || r > up.r)) up = { c, v, a, r };
          if (a >= 20 && r <= 0.5 && (!down || r < down.r)) down = { c, v, a, r };
        });
        if (up) out.push({ tone: "bad", text: `Negli ultimi 7 giorni in ${catMeta("expense", up.c).label.toLowerCase()} hai speso ${fmtEUR(up.v)}, il ${Math.round((up.r - 1) * 100)}% in più della tua media settimanale (${fmtEUR(up.a)}).` });
        else if (down) out.push({ tone: "good", text: `Negli ultimi 7 giorni in ${catMeta("expense", down.c).label.toLowerCase()} hai speso ${fmtEUR(down.v)}, meno della metà della tua media settimanale (${fmtEUR(down.a)}).` });
      }
      const sorted = [...exps].sort((a, b) => a.date.localeCompare(b.date));
      const sums = {}, counts = {};
      const recentFrom = addDaysISO(todayISO, -13);
      let unusual = null;
      sorted.forEach((t) => {
        const n = counts[t.category] || 0;
        if (n >= 3 && t.date >= recentFrom && t.amount >= 15) {
          const avg = sums[t.category] / n;
          if (t.amount >= avg * 2.5) unusual = { t, ratio: t.amount / avg };
        }
        sums[t.category] = (sums[t.category] || 0) + t.amount;
        counts[t.category] = n + 1;
      });
      if (unusual) {
        const lbl = catMeta("expense", unusual.t.category).label.toLowerCase();
        out.push({ tone: "bad", text: `Spesa insolita il ${fmtDateShort(unusual.t.date)}: ${fmtEUR(unusual.t.amount)} per ${unusual.t.description || lbl}, circa ${Math.round(unusual.ratio)} volte la tua spesa media in ${lbl}.` });
      }
      const lastMonths = [1, 2, 3].map((i) => shiftMonth(curKey, -i)).filter((k) => agg[k] && agg[k].exp > 0);
      if (dayNum >= 5 && lastMonths.length) {
        const avgM = lastMonths.reduce((s, k) => s + agg[k].exp, 0) / lastMonths.length;
        const proj = (expMTD / dayNum) * daysInMonth(curKey);
        const p = ((proj - avgM) / avgM) * 100;
        const ref = lastMonths.length === 1 ? "del mese scorso" : `della media degli ultimi ${lastMonths.length} mesi`;
        if (p >= 15) out.push({ tone: "bad", text: `Al ritmo attuale chiuderai ${monthName(curKey)} con circa ${fmtEUR(proj)} di uscite, il ${Math.round(p)}% in più ${ref} (${fmtEUR(avgM)}).` });
        else if (p <= -15) out.push({ tone: "good", text: `Al ritmo attuale chiuderai ${monthName(curKey)} con circa ${fmtEUR(proj)} di uscite, il ${Math.round(-p)}% in meno ${ref} (${fmtEUR(avgM)}).` });
      }
      const over = EXPENSE_CATEGORIES.filter((c) => budgets[c.id] > 0 && (curAgg.cat[c.id] || 0) > budgets[c.id]);
      if (over.length === 1) out.push({ tone: "bad", text: `Hai superato il budget di ${over[0].label.toLowerCase()} di ${fmtEUR(curAgg.cat[over[0].id] - budgets[over[0].id])}.` });
      else if (over.length > 1) out.push({ tone: "bad", text: `Questo mese hai superato il budget in ${over.length} categorie: ${over.map((c) => c.label.toLowerCase()).join(", ")}.` });
      const mm = {};
      exps.filter((t) => monthKeyOf(t.date) === curKey && t.description).forEach((t) => {
        const k = t.description.toLowerCase();
        mm[k] = mm[k] || { name: t.description, n: 0, tot: 0 };
        mm[k].n++; mm[k].tot += t.amount;
      });
      const topM = Object.values(mm).sort((a, b) => b.tot - a.tot)[0];
      if (topM && topM.n >= 3) out.push({ tone: "info", text: `Il posto dove hai speso di più a ${monthName(curKey)} è ${topM.name}: ${fmtEUR(topM.tot)} in ${topM.n} volte.` });
    }
    if (investAccs.length && investBook > 0 && investAccs.some((a) => lastValuation(a))) {
      const pct = (investGain / investBook) * 100;
      out.push({ tone: investGain >= 0 ? "good" : "bad", text: `I tuoi investimenti valgono ${fmtEUR(investValue)} su ${fmtEUR(investBook)} versati: ${fmtSigned(investGain)} (${fmtPct(pct)}).` });
    }
    const g = goals.find((x) => x.deadline && x.saved < x.target && goalMonthly(x, todayISO) != null);
    if (g) out.push({ tone: "info", text: `Per ${g.name} servono ${fmtEUR(goalMonthly(g, todayISO))} al mese fino al ${fmtDateShort(g.deadline)}.` });
    if (owedToMe > 0) out.push({ tone: "info", text: `Dalle spese condivise devi ricevere in tutto ${fmtEUR(owedToMe)}.` });
    return out;
  }, [transactions, todayISO, agg, budgets, goals, owedToMe, accounts]);

  /* ---------- azioni ---------- */
  const saveTx = (tx, old) => {
    setData((d) => {
      let acc = d.accounts;
      if (old) acc = applyEffects(acc, txEffects(old), -1);
      acc = applyEffects(acc, txEffects(tx), 1);
      const txs = old ? d.transactions.map((t) => (t.id === tx.id ? tx : t)) : [...d.transactions, tx];
      return { ...d, transactions: txs, accounts: acc };
    });
    setTxModal(null); setTrModal(null);
    setNote(old ? "Movimento aggiornato" : tx.type === "transfer" ? "Giroconto registrato" : "Movimento registrato");
  };
  const deleteTx = (tx) => {
    setData((d) => ({ ...d, transactions: d.transactions.filter((t) => t.id !== tx.id), accounts: applyEffects(d.accounts, txEffects(tx), -1) }));
    setTxModal(null); setTrModal(null);
    setNote("Movimento eliminato");
  };
  const openTx = (tx) => (tx.type === "transfer" ? setTrModal({ tx }) : setTxModal({ tx }));

  const setRecurring = (f) => setData((d) => ({ ...d, recurring: f(d.recurring) }));
  const saveRecurring = (item) => {
    setRecurring((prev) => {
      const old = prev.find((r) => r.id === item.id);
      let processedThrough = yesterdayISO;
      if (old) {
        const base = old.processedThrough || yesterdayISO;
        if (old.refDate !== item.refDate || old.frequency !== item.frequency) processedThrough = yesterdayISO;
        else if (item.auto && !old.auto) processedThrough = maxISO(base, yesterdayISO);
        else processedThrough = base;
      }
      const next = { ...item, processedThrough };
      return old ? prev.map((r) => (r.id === item.id ? next : r)) : [...prev, next];
    });
    setRecModal(null);
    setNote("Movimento ricorrente salvato");
  };
  const deleteRecurring = (id) => { setRecurring((prev) => prev.filter((r) => r.id !== id)); setRecModal(null); };
  const toggleRec = (id, field) => setRecurring((prev) => prev.map((r) => {
    if (r.id !== id) return r;
    const val = !r[field];
    return val ? { ...r, [field]: val, processedThrough: maxISO(r.processedThrough || yesterdayISO, yesterdayISO) } : { ...r, [field]: val };
  }));
  const markRecurringPaid = (item) => {
    const date = item.nextISO < todayISO ? item.nextISO : todayISO;
    const tx = recurringTx(item, date);
    setData((d) => ({
      ...d,
      transactions: [...d.transactions, tx],
      accounts: applyEffects(d.accounts, txEffects(tx), 1),
      recurring: d.recurring.map((r) => (r.id === item.id ? { ...r, processedThrough: item.nextISO } : r)),
    }));
    setNote(item.kind === "income" ? "Entrata registrata" : item.kind === "transfer" ? "Trasferimento registrato" : "Pagamento registrato");
  };

  const saveAccount = (acc, initialValue) => {
    setData((d) => {
      let a = { ...acc };
      if (!d.accounts.some((x) => x.id === a.id) && isInvest(a) && initialValue != null && initialValue > 0) {
        a.valuations = [{ date: todayISO, value: round2(initialValue), book: a.balance }];
      }
      return { ...d, accounts: d.accounts.some((x) => x.id === a.id) ? d.accounts.map((x) => (x.id === a.id ? a : x)) : [...d.accounts, a] };
    });
    setAccModal(null);
    setNote("Conto salvato");
  };
  const deleteAccount = (id) => { setData((d) => ({ ...d, accounts: d.accounts.filter((a) => a.id !== id) })); setAccModal(null); };
  const saveValuation = (id, value, date) => {
    const book = bookAt(date, new Set([id]));
    setData((d) => ({ ...d, accounts: d.accounts.map((a) => (a.id === id ? { ...a, valuations: [...(a.valuations || []).filter((v) => v.date !== date), { date, value, book }].sort((x, y) => x.date.localeCompare(y.date)) } : a)) }));
    setValModal(null);
    setNote("Valore aggiornato");
  };

  const setBudget = (catId, value) => {
    setData((d) => { const b = { ...d.budgets }; if (value > 0) b[catId] = value; else delete b[catId]; return { ...d, budgets: b }; });
    setBudgetModal(null);
  };

  const saveGoal = (g, old) => {
    setData((d) => {
      let goal = { ...g };
      if (!old) {
        goal.createdAt = todayISO;
        goal.history = g.saved > 0 ? [{ date: todayISO, delta: g.saved }] : [];
      } else {
        const delta = round2(g.saved - old.saved);
        goal.history = [...(old.history || []), ...(Math.abs(delta) > 0.004 ? [{ date: todayISO, delta }] : [])];
      }
      return { ...d, goals: old ? d.goals.map((x) => (x.id === goal.id ? goal : x)) : [...d.goals, goal] };
    });
    setGoalModal(null);
    setNote("Obiettivo salvato");
  };
  const deleteGoal = (id) => { setData((d) => ({ ...d, goals: d.goals.filter((x) => x.id !== id) })); setGoalModal(null); setGoalOpen(null); };
  const moveGoal = (id, delta) => {
    setData((d) => ({ ...d, goals: d.goals.map((x) => (x.id === id ? { ...x, saved: round2(Math.max(0, x.saved + delta)), history: [...(x.history || []), { date: todayISO, delta }] } : x)) }));

  const addPerson = (name) => setData((d) => ({ ...d, people: [...d.people, { id: uid("p"), name }] }));
  const renamePerson = (id, name) => setData((d) => ({ ...d, people: d.people.map((p) => (p.id === id ? { ...p, name } : p)) }));
  const deletePerson = (id) => { setData((d) => ({ ...d, people: d.people.filter((p) => p.id !== id) })); setPersonOpen(null); };
  const saveShared = (entry) => {
    setData((d) => {

      if (my > 0) {
        const tx = { id: uid("t"), type: "expense", amount: my, category: e.category, description: e.description, date: e.date, accountId: e.payer === "me" ? e.accountId || null : null, sharedId: e.id, tags: [] };
        txs = [...txs, tx];
        acc = applyEffects(acc, txEffects(tx), 1);
        e.txId = tx.id;
      }
      acc = applyEffects(acc, sharedExtraEffects(e), 1);
      return { ...d, transactions: txs, accounts: acc, shared: [...d.shared, e] };
    });
    setSharedModal(false);
    setSettleFor(null);
    setNote(entry.kind === "settle" ? "Saldo registrato" : "Spesa condivisa registrata");
  };
  const deleteShared = (e) => {
    setData((d) => {
      let txs = d.transactions;
      let acc = d.accounts;
      const tx = e.txId ? txs.find((t) => t.id === e.txId) : null;
      if (tx) { txs = txs.filter((t) => t.id !== tx.id); acc = applyEffects(acc, txEffects(tx), -1); }
      acc = applyEffects(acc, sharedExtraEffects(e), -1);
      return { ...d, transactions: txs, accounts: acc, shared: d.shared.filter((x) => x.id !== e.id) };

    setNote("Voce eliminata");

  const setInvestSetting = (k, v) => setData((d) => ({ ...d, investSettings: { ...d.investSettings, [k]: v } }));

  /* ---------- Wallet e Siri ---------- */

  const onWalletFile = async (e) => {
    const f = e.target.files && e.target.files[0];

    if (!f) return;
    let text = "";
    try { text = await f.text(); } catch (err) { window.alert("Impossibile leggere il file scelto."); return; }
    const { items, valid } = parseWalletFile(text, new Set(data.walletSeen), todayISO);
    if (!valid) { window.alert("Il file non contiene spese nel formato previsto. Ogni riga deve essere data|esercente|importo|carta: controlla il comando rapido."); return; }
    if (!items.length) { setData((d) => ({ ...d, walletLastImport: new Date().toISOString() })); setNote("Nessuna nuova spesa da importare"); return; }
    const liquid = accounts.filter((a) => !isInvest(a));
    setWalletReview(items.map((it) => ({
      ...it,
      category: data.merchantMap[it.merchant.toLowerCase()] || "altro-u",
      accountId: it.card && data.cardMap[it.card] && accById[data.cardMap[it.card]] ? data.cardMap[it.card] : liquid.length === 1 ? liquid[0].id : "",
    })));
  };
  const confirmWallet = (rows) => {
    const inc = rows.filter((r) => r.include && r.amount > 0);
    setData((d) => {
      const txs = [...d.transactions];
      let acc = d.accounts;
      const mm = { ...d.merchantMap }, cm = { ...d.cardMap };
      inc.forEach((r) => {
        const voice = r.card && r.card.toLowerCase() === "contanti";
        const tx = { id: uid("t"), type: "expense", amount: r.amount, category: r.category, description: r.merchant || (voice ? "Spesa in contanti" : "Pagamento con Wallet"), date: r.date, accountId: r.accountId || null, source: voice ? "voice" : "wallet", tags: [] };
        txs.push(tx);
        acc = applyBalance(acc, tx.accountId, -tx.amount);
        if (r.merchant) mm[r.merchant.toLowerCase()] = r.category;
        if (r.card && r.accountId) cm[r.card] = r.accountId;
      });
      return { ...d, transactions: txs, accounts: acc, merchantMap: mm, cardMap: cm, walletSeen: [...d.walletSeen, ...rows.map((r) => r.hash)], walletLastImport: new Date().toISOString() };
    });
    setWalletReview(null);
    setNote(inc.length === 1 ? "1 spesa importata" : `${inc.length} spese importate`);
  };
  const ignoreWallet = () => {
    const hashes = walletReview.map((r) => r.hash);
    setData((d) => ({ ...d, walletSeen: [...d.walletSeen, ...hashes], walletLastImport: new Date().toISOString() }));
    setWalletReview(null);
    setNote("Spese segnate come già registrate");
  };
  const walletLastLabel = data.walletLastImport ? `Ultima importazione ${relativeDay(data.walletLastImport, todayISO)}` : "Da Wallet e dai contanti dettati a Siri";

  const newPacPreset = () => ({ kind: "transfer", name: "Versamento investimenti", toAccountId: investAccs[0]?.id || "", accountId: cashAccs[0]?.id || "" });
  const pickAdd = (id) => {
    setAddSheet(false);
    if (id === "expense" || id === "income") setTxModal({ tx: null, type: id });
    else if (id === "wallet") openWalletPicker();
    else if (id === "shared") setSharedModal(true);
    else if (id === "transfer") setTrModal({ tx: null });
    else if (id === "rec-expense") setRecModal({ item: null, preset: { kind: "expense" } });
    else if (id === "rec-income") setRecModal({ item: null, preset: { kind: "income" } });
    else if (id === "rec-transfer") setRecModal({ item: null, preset: newPacPreset() });
    else if (id === "goal") setGoalModal({ goal: null });
    else if (id === "account") setAccModal({ acc: null });
  };
  const goTo = (t, sub) => { setTab(t); if (t === "analysis" && sub) setAnTab(sub); if (t === "accounts" && sub) setAccTab(sub); };

  /* ================= Oggi ================= */
  const steps = [
    { done: accounts.length > 0, title: "Aggiungi i tuoi conti", text: "Con il saldo di oggi: banca, carta, contanti, investimenti.", go: () => setAccModal({ acc: null }) },
    { done: recurring.length > 0, title: "Inserisci i movimenti fissi", text: "Affitto, abbonamenti, borsa di studio, versamenti mensili.", go: () => setRecModal({ item: null, preset: { kind: "expense" } }) },
    { done: transactions.length > 0, title: "Registra il primo movimento", text: "Ogni spesa collegata a un conto ne aggiorna il saldo.", go: () => setTxModal({ tx: null, type: "expense" }) },
  ];
  const showSteps = steps.some((s) => !s.done);
  const recentTx = useMemo(() => [...transactions].sort((a, b) => b.date.localeCompare(a.date) || (b.id > a.id ? 1 : -1)).slice(0, 5), [transactions]);

  const renderOverview = () => (
    <div>
      <header className="mb-4">
        <div className="text-sm muted">{cap(fmtDayLong(todayISO))}</div>
        <h1 className="serif text-[32px] leading-tight">{cap(monthLabel(curKey))}</h1>
      </header>

      <div className="relative overflow-hidden" style={{ background: "var(--note)", color: "var(--note-ink)", borderRadius: 22 }}>
        <Guilloche />
        <div className="relative p-5 pb-4">
          <div className="flex items-start justify-between gap-3">
            <div className="text-sm" style={{ color: "var(--note-soft)" }}>{investAccs.length ? "Liquidità disponibile" : "Disponibile sui conti"}</div>
            {accounts.length > 0 && Math.abs(liq30) > 0.5 && (
              <div className="text-xs num px-2 py-0.5 rounded-full" style={{ background: "rgba(255,255,255,.12)" }}>{liq30 > 0 ? "▲" : "▼"} {fmtEUR0(Math.abs(liq30))} in 30 giorni</div>
            )}
          </div>
          {accounts.length ? (
            <div className="serif num mt-1" style={{ fontSize: 42, lineHeight: 1.05 }}>{fmtEUR(liquidity)}</div>
          ) : (
            <button onClick={() => setAccModal({ acc: null })} className="serif text-[26px] mt-1 text-left underline underline-offset-4">Aggiungi un conto</button>
          )}
          {goalsSaved > 0 && <div className="text-xs mt-1 num" style={{ color: "var(--note-soft)" }}>di cui {fmtEUR(goalsSaved)} accantonati negli obiettivi, liberi {fmtEUR(liquidity - goalsSaved)}</div>}
          {accounts.length > 0 && <div className="mt-3 -mx-1"><Sparkline values={liqHistory} color="var(--note-ink)" height={42} /></div>}
          <div className="grid grid-cols-2 gap-4 mt-3">
            <div>
              <div className="text-xs" style={{ color: "var(--note-soft)" }}>Previsto a fine {monthName(curKey)}</div>
              <div className="num text-lg font-semibold mt-0.5">{fmtEUR(projected)}</div>
            </div>
            <div>
              <div className="text-xs" style={{ color: "var(--note-soft)" }}>Risparmio di {monthName(curKey)}</div>
              <div className="num text-lg font-semibold mt-0.5">{fmtSigned(savingsCur)}</div>
            </div>
          </div>
          {investAccs.length > 0 && (
            <button onClick={() => goTo("accounts", "invest")} className="w-full flex items-center justify-between mt-4 pt-3 text-left" style={{ borderTop: "1px solid rgba(255,255,255,.16)" }}>
              <span className="text-xs" style={{ color: "var(--note-soft)" }}>Patrimonio con investimenti</span>
              <span className="num text-[15px] font-semibold">{fmtEUR(netWorth)} {investGain !== 0 && <span className="text-xs" style={{ color: "var(--note-soft)" }}>({fmtPct(investBook > 0 ? (investGain / investBook) * 100 : 0)})</span>}</span>
            </button>
          )}
        </div>
      </div>

      <div className="mt-3">
        <WalletButton lastLabel={walletLastLabel} onClick={openWalletPicker} />
        {!data.walletLastImport && <button onClick={() => setGuide(true)} className="text-sm c-blue mt-2 px-1">Come si configura</button>}
      </div>

      {showSteps && (
        <Section title="Per iniziare">
          <Rows>
            {steps.map((s, i) => (
              <button key={i} onClick={s.go} className="w-full flex items-start gap-3 py-3 text-left" disabled={s.done}>
                <span className="w-7 h-7 rounded-full flex items-center justify-center shrink-0 text-sm font-semibold num" style={{ background: s.done ? "var(--green)" : "var(--surface2)", color: s.done ? "var(--surface)" : "var(--ink)" }}>{s.done ? <Check size={15} /> : i + 1}</span>
                <span>
                  <span className="block text-[15px] font-medium" style={{ textDecoration: s.done ? "line-through" : "none", color: s.done ? "var(--muted)" : "var(--ink)" }}>{s.title}</span>
                  {!s.done && <span className="block text-xs muted mt-0.5">{s.text}</span>}
                </span>
              </button>
            ))}
          </Rows>
        </Section>
      )}

      {insights.length > 0 && (
        <Section title="Da notare" action={insights.length > 3 && <button onClick={() => goTo("analysis", "trend")} className="text-sm c-blue">Tutte</button>}>
          <Insights items={insights.slice(0, 3)} />
        </Section>
      )}

      <Section title="Questo mese, fino a oggi">
        <div className="panel">
          <div className="grid grid-cols-2">
            <div className="p-4" style={{ borderRight: "1px solid var(--line)" }}>
              <div className="text-sm muted">Uscite</div>
              <div className="num text-[22px] font-semibold mt-0.5">{fmtEUR(expMTD)}</div>
              <div className="mt-1"><Delta cur={expMTD} prev={expPrevMTD} upIsGood={false} /></div>
              <div className="text-xs muted mt-1 num">{fmtEUR(expPrevMTD)} a {monthName(prevKey)} alla stessa data</div>
            </div>
            <div className="p-4">
              <div className="text-sm muted">Entrate</div>
              <div className="num text-[22px] font-semibold mt-0.5 c-green">{fmtEUR(incMTD)}</div>
              <div className="mt-1"><Delta cur={incMTD} prev={incPrevMTD} upIsGood={true} /></div>
              <div className="text-xs muted mt-1 num">{fmtEUR(incPrevMTD)} a {monthName(prevKey)} alla stessa data</div>
            </div>
          </div>
          {monthCats.length > 0 && (
            <button onClick={() => { setAnMonth(curKey); goTo("analysis", "month"); }} className="w-full text-left px-4 pb-4 pt-3" style={{ borderTop: "1px solid var(--line)" }}>
              <div className="flex h-2.5 rounded-full overflow-hidden" style={{ gap: 2 }}>
                {monthCats.map((c) => <div key={c.id} style={{ width: `${(c.v / curAgg.exp) * 100}%`, background: c.color }} />)}
              </div>
              <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2.5">
                {monthCats.slice(0, 4).map((c) => (
                  <span key={c.id} className="flex items-center gap-1.5 text-xs">
